<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle, hasError)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="same-origin">
    <meta name="pds-busy-text" th:content="#{common.busy}" content="...">
    <title th:text="${hasError} ? #{layout.title.error(${pageTitle})} : #{layout.title.normal(${pageTitle})}">PlanDoSee Diary</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <script th:src="@{/js/app.js}" src="/js/app.js" defer></script>
</head>
<body>

<header th:fragment="header(activeNav)" class="site-header">
    <a class="skip-link" href="#main" th:text="#{layout.skipLink}">skip</a>
    <div class="public-banner">
        <strong class="public-banner__label" th:text="#{layout.banner.label}">notice</strong>
        <span class="public-banner__text" data-test="public-banner"
              th:text="${publicNotice} ?: #{public.notice}">notice text</span>
    </div>
    <div class="site-bar">
        <a class="brand" th:href="@{/}" href="/" th:text="#{layout.brand}">PlanDoSee Diary</a>
        <nav class="main-nav" th:attr="aria-label=#{layout.nav.label}">
            <ul>
                <li><a th:href="@{/}" href="/"
                       th:classappend="${activeNav == 'home'} ? 'is-current'"
                       th:attr="aria-current=${activeNav == 'home'} ? 'page' : null"
                       th:text="#{layout.nav.home}">home</a></li>
                <li><a th:href="@{/plans}" href="/plans"
                       th:classappend="${activeNav == 'plans'} ? 'is-current'"
                       th:attr="aria-current=${activeNav == 'plans'} ? 'page' : null"
                       th:text="#{layout.nav.plans}">plans</a></li>
                <li><a th:href="@{/export}" href="/export"
                       th:classappend="${activeNav == 'export'} ? 'is-current'"
                       th:attr="aria-current=${activeNav == 'export'} ? 'page' : null"
                       th:text="#{layout.nav.export}">export</a></li>
            </ul>
        </nav>
    </div>
</header>

<!--/* PRG result notice. flashKey: message key, flashArgs: optional Object[] (web-contract revision 3) */-->
<div th:fragment="flash" class="flash" role="status" aria-live="polite" data-js="flash"
     th:with="hasFlash=${flashKey != null and !#strings.isEmpty(flashKey)}"
     th:classappend="${!hasFlash} ? 'flash--empty'"><th:block
        th:if="${hasFlash}"><strong class="flash__label" th:text="#{layout.flash.label}">result</strong>
    <span class="flash__text" data-test="flash"
          th:text="${flashArgs == null} ? ${#messages.msg(flashKey)} : ${#messages.msgWithParams(flashKey, flashArgs)}">message</span></th:block></div>

<footer th:fragment="footer" class="site-footer">
    <p><span th:text="#{layout.footer.zone}">zone</span><th:block th:if="${today != null}"> <span
            th:text="#{layout.footer.todayLabel}">today</span> <time th:attr="datetime=${today}" th:text="${today}">2026-01-01</time></th:block></p>
</footer>

<!--/* Seoul date-time display. value: OffsetDateTime. displayZone: common model attribute (Asia/Seoul) */-->
<time th:fragment="datetime(value)"
      th:if="${value != null}"
      th:attr="datetime=${value}"
      th:text="${#temporals.format(value.atZoneSameInstant(displayZone), 'yyyy-MM-dd HH:mm:ss')}">2026-01-01 00:00:00</time>

<!--/* Variance sign notation: +n / -n / 0 with minutes. v: number */-->
<th:block th:fragment="signedMinutes(v)"><th:block th:if="${v > 0}" th:text="#{common.minutes.over(${v})}">+0</th:block><th:block
        th:if="${v < 0}" th:text="#{common.minutes.under(${-v})}">-0</th:block><th:block
        th:if="${v == 0}" th:text="#{common.minutes.zero}">0</th:block></th:block>

<!--/* Evidence reconciliation verdict. ok: boolean. Text is the cue; color is secondary (D8: no underline) */-->
<strong th:fragment="verdict(ok)" class="verdict" data-test="evidence-verdict" th:data-value="${ok}"
        th:classappend="${ok} ? 'verdict--ok' : 'verdict--bad'"
        th:text="${ok} ? #{common.verdict.ok} : #{common.verdict.bad}">ok</strong>

<!--/* Enum label (ADR-17 F-4). The only place that builds enum.<Type>.<NAME> keys.
       type: enum simple name (Priority, TodoStatus, DueFilter, TodoSort), value: enum constant or its name. */-->
<th:block th:fragment="enumLabel(type, value)"
          th:text="${#messages.msg('enum.' + type + '.' + value)}">label</th:block>

<!--/* The same enum label placed as {0} into a sentence key, e.g. plans.item.priority (label, then {0}). */-->
<th:block th:fragment="enumLabelIn(key, type, value)"
          th:text="${#messages.msg(key, #messages.msg('enum.' + type + '.' + value))}">label</th:block>

<!--/* Error summary. Must be included inside a form with th:object. One heading for every case (ADR-18 E3):
       validation errors, rule errors and the 409 conflict re-render (concurrency.form.retry) all mean "not saved".
       Global errors have no field to jump to, so they are plain text. Inputs keep the submitted values (th:field). */-->
<div th:fragment="errorSummary" th:if="${#fields.hasErrors('*')}"
     class="error-summary" role="alert" tabindex="-1" id="error-summary" data-js="error-summary">
    <h2 th:text="#{form.errorSummary.heading}">errors</h2>
    <ul>
        <li th:each="err : ${#fields.detailedErrors()}">
            <a th:if="${!err.global}" th:href="${'#' + err.fieldName}" href="#" th:text="${err.message}">field error</a>
            <span th:if="${err.global}" data-test="form-global-error" th:text="${err.message}">global error</span>
        </li>
    </ul>
</div>

<!--/* Field error. Must be included inside a form with th:object. name: field name (also input id) */-->
<p th:fragment="fieldError(name)" th:if="${#fields.hasErrors(name)}"
   class="field-error" th:id="${name + '-error'}" th:data-test="${'field-error-' + name}">
    <th:block th:each="msg, st : ${#fields.errors(name)}"><span class="field-error__prefix"
            th:text="#{form.fieldError.prefix}">error</span> <span th:text="${msg}">message</span><br th:if="${!st.last}"></th:block>
</p>

</body>
</html>
