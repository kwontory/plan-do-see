<!DOCTYPE html>
<!--/* ADR-17 F-3: shared error page. Each error/<status>.html passes only its message keys. */-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:fragment="errorPage(titleKey, bodyKey)"
      th:with="errorTitle=${#messages.msg(titleKey)}">
<head th:replace="~{fragments/layout :: head(${errorTitle}, false)}">
    <meta charset="UTF-8">
    <title>error</title>
</head>
<body>
<header th:replace="~{fragments/layout :: header('none')}"></header>

<main id="main" tabindex="-1" class="wrap">
    <div class="page-head">
        <h1 th:text="${errorTitle}">error</h1>
        <p class="subtitle subtitle--body" th:text="${#messages.msg(bodyKey)}">error</p>
    </div>
    <ul class="link-row">
        <li><a class="btn" th:href="@{/}" href="/" th:text="#{common.home}">home</a></li>
        <li><a class="btn btn--secondary" th:href="@{/plans}" href="/plans" th:text="#{common.planList}">plans</a></li>
    </ul>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
