<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* S02 list state (contract amendment 1, Q10). filter: TodoListQuery.
       withPriority=false on the add form: TodoForm.priority owns "priority" there, so the list
       priority condition is sent as "listPriority" (main agent decision). */-->
<th:block th:fragment="listState(filter, withPriority)">
    <input type="hidden" name="returnTo" value="list">
    <input type="hidden" name="q" th:value="${filter != null ? filter.q : null}">
    <input type="hidden" name="status" th:value="${filter != null ? filter.status : null}">
    <input type="hidden" name="priority" th:if="${withPriority}" th:value="${filter != null ? filter.priority : null}">
    <input type="hidden" name="listPriority" th:if="${!withPriority and filter != null and filter.priority != null}" th:value="${filter.priority}">
    <input type="hidden" name="tagId" th:value="${filter != null ? filter.tagId : null}">
    <input type="hidden" name="due" th:value="${filter != null ? filter.due : null}">
    <input type="hidden" name="sort" th:value="${filter != null ? filter.sort : null}">
</th:block>

<!--/* Status + derived badges. todo: TodoRow or EvidenceTodo with the server flags completed, overdue, dueToday
       (web-contract revision 4, ADR-17 F-2: the template does not compare dates). dueToday looks at the date only,
       so the badge also checks !completed. */-->
<th:block th:fragment="statusBadges(todo)">
    <span th:if="${todo.completed}" class="badge badge--done"><span aria-hidden="true">✓ </span><th:block
            th:text="#{enum.TodoStatus.COMPLETED}">done</th:block></span>
    <span th:unless="${todo.completed}" class="badge badge--progress" th:text="#{enum.TodoStatus.IN_PROGRESS}">in progress</span>
    <span th:if="${todo.overdue}" class="badge badge--overdue" th:text="#{badge.overdue}">overdue</span>
    <span th:if="${!todo.completed and todo.dueToday}" class="badge badge--today" th:text="#{badge.dueToday}">today</span>
</th:block>

<!--/* TodoForm fields. Must be included inside a form with th:object="${todoForm}". */-->
<th:block th:fragment="todoFields(priorities)">
    <div class="field">
        <label for="title" th:text="#{form.todo.title.label}">title</label>
        <p class="field-help" id="title-help" th:text="#{form.title.help}">help</p>
        <p th:replace="~{fragments/layout :: fieldError('title')}"></p>
        <input type="text" th:field="*{title}" maxlength="200" required
               th:attr="aria-describedby=${#fields.hasErrors('title')} ? 'title-help title-error' : 'title-help',aria-invalid=${#fields.hasErrors('title')} ? 'true' : null">
    </div>
    <div class="field">
        <label for="dueDate" th:text="#{form.todo.dueDate.label}">due</label>
        <p class="field-help" id="dueDate-help" th:text="#{form.todo.dueDate.help}">help</p>
        <p th:replace="~{fragments/layout :: fieldError('dueDate')}"></p>
        <input type="date" th:field="*{dueDate}"
               th:attr="aria-describedby=${#fields.hasErrors('dueDate')} ? 'dueDate-help dueDate-error' : 'dueDate-help',aria-invalid=${#fields.hasErrors('dueDate')} ? 'true' : null">
    </div>
    <div class="field">
        <label for="priority" th:text="#{form.priority.label}">priority</label>
        <p th:replace="~{fragments/layout :: fieldError('priority')}"></p>
        <select th:field="*{priority}" required
                th:attr="aria-describedby=${#fields.hasErrors('priority')} ? 'priority-error' : null,aria-invalid=${#fields.hasErrors('priority')} ? 'true' : null">
            <option value="" th:text="#{common.select.placeholder}">select</option>
            <option th:each="pr : ${priorities}" th:value="${pr}"><th:block
                    th:replace="~{fragments/layout :: enumLabel('Priority', ${pr})}">priority</th:block></option>
        </select>
    </div>
    <div class="field">
        <label for="estimatedMinutes" th:text="#{form.estimatedMinutes.label}">minutes</label>
        <p class="field-help" id="estimatedMinutes-help" th:text="#{form.todo.estimatedMinutes.help}">help</p>
        <p th:replace="~{fragments/layout :: fieldError('estimatedMinutes')}"></p>
        <span class="input-unit">
            <input type="number" th:field="*{estimatedMinutes}" min="0" max="525600" step="1" inputmode="numeric" required
                   th:attr="aria-describedby=${#fields.hasErrors('estimatedMinutes')} ? 'estimatedMinutes-help estimatedMinutes-error' : 'estimatedMinutes-help',aria-invalid=${#fields.hasErrors('estimatedMinutes')} ? 'true' : null">
            <span aria-hidden="true" th:text="#{form.unit.minutes}">min</span>
        </span>
    </div>
    <div class="field">
        <label for="tags" th:text="#{form.todo.tags.label}">tags</label>
        <p class="field-help" id="tags-help" th:text="#{form.todo.tags.help}">help</p>
        <p th:replace="~{fragments/layout :: fieldError('tags')}"></p>
        <input type="text" th:field="*{tags}"
               th:attr="aria-describedby=${#fields.hasErrors('tags')} ? 'tags-help tags-error' : 'tags-help',aria-invalid=${#fields.hasErrors('tags')} ? 'true' : null">
    </div>
</th:block>

</body>
</html>
