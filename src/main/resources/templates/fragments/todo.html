<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* Todo list state and the page shown. filter: TodoListQuery.
       withPriority=false on the add form: TodoForm.priority owns "priority" there, so the list
       priority condition is sent as "listPriority". */-->
<th:block th:fragment="listState(filter, withPriority)">
    <input type="hidden" name="returnTo" value="list">
    <input type="hidden" name="q" th:value="${filter != null ? filter.q : null}">
    <input type="hidden" name="status" th:value="${filter != null ? filter.status : null}">
    <input type="hidden" name="priority" th:if="${withPriority}" th:value="${filter != null ? filter.priority : null}">
    <input type="hidden" name="listPriority" th:if="${!withPriority and filter != null and filter.priority != null}" th:value="${filter.priority}">
    <input type="hidden" name="tagId" th:value="${filter != null ? filter.tagId : null}">
    <input type="hidden" name="due" th:value="${filter != null ? filter.due : null}">
    <input type="hidden" name="sort" th:value="${filter != null ? filter.sort : null}">
    <input type="hidden" name="page" th:value="${filter != null ? filter.page : null}">
</th:block>

<!--/* Status + derived badges as pills: state (in progress grey / completed green with a check), then overdue
       (red with a flag) or due today. todo: TodoRow or EvidenceTodo with the server flags completed, overdue, dueToday
       (the template does not compare dates). dueToday looks at the date only,
       so the badge also checks !completed. The word carries the meaning; color and icon are secondary. */-->
<th:block th:fragment="statusBadges(todo)">
    <span th:if="${todo.completed}" class="badge badge--done"><svg th:replace="~{fragments/layout :: icon('check')}"></svg><th:block
            th:text="#{enum.TodoStatus.COMPLETED}">done</th:block></span>
    <span th:unless="${todo.completed}" class="badge badge--state" th:text="#{enum.TodoStatus.IN_PROGRESS}">in progress</span>
    <span th:if="${todo.overdue}" class="badge badge--over"><svg th:replace="~{fragments/layout :: icon('flag')}"></svg><th:block
            th:text="#{badge.overdue}">overdue</th:block></span>
    <span th:if="${!todo.completed and todo.dueToday}" class="badge badge--today" th:text="#{badge.dueToday}">today</span>
</th:block>

<!--/* State dropdown of the todo detail ("상태" row of the info card). details/summary, no select or role=menu, no menu
       heading. The summary shows the current state (enum.TodoStatus.*); its name adds the hidden
       todos.detail.state.change. The panel lists both states in a fixed order (in progress, completed): the current
       one is plain text with todos.detail.state.current, the other one is a POST form button (the completion
       endpoint, same hidden fields as before: idempotencyKey + returnTo for completing, _method=delete + returnTo for
       reopening; the CSRF field is added by Thymeleaf). Overdue / due today stay on the due date chip only.
       todo: TodoRow (status, completed); completionKey: the server-issued idempotency key. app.js closes the menu on
       Escape (focus back on the summary) and on a click outside (data-js="state-menu"). */-->
<details th:fragment="stateMenu(todo, completionKey)" class="state-menu" data-js="state-menu"
         th:classappend="${todo.completed} ? 'state-menu--done'">
    <summary class="state-menu__button" data-test="completion-menu" th:data-value="${todo.status}"><span
            class="state-menu__ring" aria-hidden="true"><svg th:replace="~{fragments/layout :: icon('check')}"></svg></span><th:block
            th:replace="~{fragments/layout :: enumLabel('TodoStatus', ${todo.status})}">state</th:block><span class="visually-hidden"
            th:text="${#messages.msg('common.srContext', #messages.msg('todos.detail.state.change'))}">: change</span><span
            class="state-menu__chevron" aria-hidden="true"><svg th:replace="~{fragments/layout :: icon('chevron-down')}"></svg></span></summary>
    <div class="state-menu__panel">
        <ul class="state-menu__list" th:attr="aria-label=#{todos.detail.state.change}">
            <li th:if="${todo.completed}"><form method="post" th:action="@{/todos/{id}/completion(id=${todo.id})}">
                <input type="hidden" name="_method" value="delete">
                <input type="hidden" name="returnTo" value="detail">
                <button type="submit" class="state-menu__option" data-test="completion-reopen"><span class="state-menu__blank" aria-hidden="true"></span><span
                        data-js="busy-label"><span aria-hidden="true" th:text="#{enum.TodoStatus.IN_PROGRESS}">in progress</span><span
                        class="visually-hidden" th:text="#{todos.action.reopen}">reopen</span></span></button>
            </form></li>
            <li th:unless="${todo.completed}"><p class="state-menu__current"><svg th:replace="~{fragments/layout :: icon('check')}"></svg><span
                    th:text="#{enum.TodoStatus.IN_PROGRESS}">in progress</span><span class="state-menu__now"
                    th:text="#{todos.detail.state.current}">current</span></p></li>
            <li th:unless="${todo.completed}"><form method="post" th:action="@{/todos/{id}/completion(id=${todo.id})}">
                <input type="hidden" name="idempotencyKey" th:value="${completionKey}">
                <input type="hidden" name="returnTo" value="detail">
                <button type="submit" class="state-menu__option" data-test="completion-complete"><span class="state-menu__blank" aria-hidden="true"></span><span
                        data-js="busy-label" th:text="#{todos.action.complete}">complete</span></button>
            </form></li>
            <li th:if="${todo.completed}"><p class="state-menu__current"><svg th:replace="~{fragments/layout :: icon('check')}"></svg><span
                    th:text="#{enum.TodoStatus.COMPLETED}">completed</span><span class="state-menu__now"
                    th:text="#{todos.detail.state.current}">current</span></p></li>
        </ul>
    </div>
</details>

<!--/* Due date chip (list row and detail): calendar icon, the date, and " · overdue" / " · due today" from the server
       flags (overdue, dueToday; the template does not compare dates). withLabel=true adds a hidden "due date" word for
       rows where no label names the value (list); the detail page has its own dt. */-->
<span th:fragment="dueChip(todo, withLabel)" class="chip"
      th:classappend="${todo.overdue} ? 'chip--overdue' : (${!todo.completed and todo.dueToday} ? 'chip--today')"><svg
        th:replace="~{fragments/layout :: icon('calendar')}"></svg><span class="visually-hidden" th:if="${withLabel and todo.dueDate != null}"
        th:text="#{todos.field.dueDate} + ' '">due </span><span class="num"
        th:text="${todo.dueDate == null} ? #{todos.item.noDue}
            : (${todo.overdue} ? ${#messages.msg('todos.item.dueWithFlag', todo.dueDate, #messages.msg('badge.overdue'))}
            : (${!todo.completed and todo.dueToday} ? ${#messages.msg('todos.item.dueWithFlag', todo.dueDate, #messages.msg('badge.dueToday'))}
            : ${todo.dueDate}))">due</span></span>

<!--/* Todo add form (composer). Must be included inside a form with th:object="${todoForm}".
       Error pattern: label -> input -> error (fieldMessage) -> help; aria-describedby lists the error before the help.
       The title label and help are visually hidden until the title has an error (the placeholder shows them; with an
       error the placeholder is dropped because the visible label names the field);
       the other fields' help lines sit under the row (todoComposerHelp) and keep their ids. */-->
<th:block th:fragment="todoComposerFields(priorities)">
    <div class="composer__title" th:with="err=${#fields.hasErrors('title')}">
        <label for="title" th:text="#{form.todo.title.label}">title</label>
        <input type="text" th:field="*{title}" maxlength="200" required
               th:attr="aria-describedby=${(err ? 'title-error ' : '') + 'title-help'},aria-invalid=${err} ? 'true' : null">
        <p th:replace="~{fragments/layout :: fieldMessage('title')}"></p>
        <p class="field-help" id="title-help" th:text="#{form.title.help}">help</p>
    </div>
    <div class="composer__row">
        <div class="field" th:with="err=${#fields.hasErrors('dueDate')}">
            <label for="dueDate" th:text="#{form.todo.dueDate.label}">due</label>
            <input th:replace="~{fragments/layout :: dateInput('date', 'dueDate', false, ${(err ? 'dueDate-error ' : '') + 'dueDate-help'})}">
            <p th:replace="~{fragments/layout :: fieldMessage('dueDate')}"></p>
        </div>
        <div class="field" th:with="err=${#fields.hasErrors('priority')}">
            <label for="priority" th:text="#{form.priority.label}">priority</label>
            <select th:field="*{priority}" required
                    th:attr="aria-describedby=${err} ? 'priority-error' : null,aria-invalid=${err} ? 'true' : null">
                <option value="" th:text="#{common.select.placeholder}">select</option>
                <option th:each="pr : ${priorities}" th:value="${pr}"><th:block
                        th:replace="~{fragments/layout :: enumLabel('Priority', ${pr})}">priority</th:block></option>
            </select>
            <p th:replace="~{fragments/layout :: fieldMessage('priority')}"></p>
        </div>
        <fieldset th:replace="~{fragments/layout :: durationInput(null, 'composer__duration')}"></fieldset>
        <div class="field" th:with="err=${#fields.hasErrors('tags')}">
            <label for="tags" th:text="#{form.todo.tags.label}">tags</label>
            <input type="text" th:field="*{tags}" th:placeholder="#{todos.add.tagsPlaceholder}"
                   th:attr="aria-describedby=${(err ? 'tags-error ' : '') + 'tags-help'},aria-invalid=${err} ? 'true' : null">
            <p th:replace="~{fragments/layout :: fieldMessage('tags')}"></p>
        </div>
    </div>
</th:block>

<!--/* Help lines of the add form's row fields (ids referenced by todoComposerFields). */-->
<div th:fragment="todoComposerHelp" class="composer__help">
    <p class="field-help" id="dueDate-help" th:text="#{todos.add.help.dueDate}">help</p>
    <p class="field-help" id="estimatedMinutes-help" th:text="#{todos.add.help.estimatedMinutes}">help</p>
    <p class="field-help" id="tags-help" th:text="#{todos.add.help.tags}">help</p>
</div>

<!--/* Latest panel values of a todo (model latest: TodoRow with tags). Status is shown but not compared. */-->
<dl th:fragment="todoLatestFields" class="dl-grid">
    <dt><th:block th:text="#{todos.field.title}">title</th:block> <span th:replace="~{fragments/layout :: changedBadge('title')}"></span></dt>
    <dd th:replace="~{fragments/layout :: latestValue('title', ${latest.title}, null)}"></dd>
    <dt th:text="#{todos.filter.status.label}">status</dt>
    <dd><th:block th:replace="~{fragments/layout :: enumLabel('TodoStatus', ${latest.status})}">status</th:block></dd>
    <dt><th:block th:text="#{todos.field.dueDate}">due</th:block> <span th:replace="~{fragments/layout :: changedBadge('dueDate')}"></span></dt>
    <dd th:replace="~{fragments/layout :: latestValue('dueDate', ${latest.dueDate != null} ? ${#strings.toString(latest.dueDate)} : #{todos.item.noDue}, 'num')}"></dd>
    <dt><th:block th:text="#{todos.field.priority}">priority</th:block> <span th:replace="~{fragments/layout :: changedBadge('priority')}"></span></dt>
    <dd th:replace="~{fragments/layout :: latestContent('priority', ~{fragments/layout :: enumLabel('Priority', ${latest.priority})}, null)}"></dd>
    <dt><th:block th:text="#{todos.field.estimatedMinutes}">estimated</th:block> <span th:replace="~{fragments/layout :: changedBadge('estimatedMinutes')}"></span></dt>
    <dd th:replace="~{fragments/layout :: latestContent('estimatedMinutes', ~{fragments/layout :: duration(${latest.estimatedDuration})}, 'num')}"></dd>
    <dt><th:block th:text="#{todos.field.tags}">tags</th:block> <span th:replace="~{fragments/layout :: changedBadge('tags')}"></span></dt>
    <dd th:replace="~{fragments/layout :: latestValue('tags', ${latest.tags != null and !latest.tags.isEmpty()} ? ${#strings.listJoin(latest.tags.![name], ', ')} : #{common.none}, null)}"></dd>
</dl>

<!--/* Submitted TodoForm shown read-only for copying. form: TodoForm; any value may be empty. */-->
<dl th:fragment="todoInputReadonly(form)" class="dl-grid">
    <dt th:text="#{todos.field.title}">title</dt>
    <dd th:text="${#strings.isEmpty(form.title)} ? #{common.none} : ${form.title}">title</dd>
    <dt th:text="#{todos.field.dueDate}">due</dt>
    <dd th:text="${form.dueDate != null} ? ${form.dueDate} : #{todos.item.noDue}">due</dd>
    <dt th:text="#{todos.field.priority}">priority</dt>
    <dd><th:block th:if="${form.priority != null}"><th:block th:replace="~{fragments/layout :: enumLabel('Priority', ${form.priority})}">priority</th:block></th:block><th:block
            th:if="${form.priority == null}" th:text="#{common.none}">none</th:block></dd>
    <dt th:text="#{todos.field.estimatedMinutes}">estimated</dt>
    <dd class="num"><th:block th:replace="~{fragments/layout :: durationOrInput(${form})}">0</th:block></dd>
    <dt th:text="#{todos.field.tags}">tags</dt>
    <dd th:text="${#strings.isEmpty(form.tags)} ? #{common.none} : ${form.tags}">tags</dd>
</dl>

<!--/* Submitted ExecutionForm shown read-only for copying. Times are the Seoul local values typed in. */-->
<dl th:fragment="executionInputReadonly(form)" class="dl-grid">
    <dt th:text="#{todos.detail.exec.startedAt}">start</dt>
    <dd th:text="${form.startedAt != null} ? ${#temporals.format(form.startedAt, 'yyyy-MM-dd HH:mm:ss')} : #{common.none}">start</dd>
    <dt th:text="#{todos.detail.exec.endedAt}">end</dt>
    <dd th:text="${form.endedAt != null} ? ${#temporals.format(form.endedAt, 'yyyy-MM-dd HH:mm:ss')} : #{common.none}">end</dd>
    <dt th:text="#{todos.detail.logs.col.blocker}">blocker</dt>
    <dd class="pre-wrap" th:text="${#strings.isEmpty(form.blockerReason)} ? #{common.none} : ${form.blockerReason}">blocker</dd>
</dl>

</body>
</html>
