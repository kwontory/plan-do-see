<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* Plan list (S00, S01). plans: List<PlanRow> */-->
<th:block th:fragment="planList(plans)">
    <p class="sort-note" th:text="#{plans.list.sortNote}">sort</p>
    <div class="empty" th:if="${plans == null or plans.isEmpty()}">
        <p th:text="#{plans.list.empty}">empty</p>
        <a class="btn" th:href="@{/plans/new}" href="/plans/new" th:text="#{plans.new}">new</a>
    </div>
    <ul class="plan-list" th:unless="${plans == null or plans.isEmpty()}">
        <li th:each="p : ${plans}">
            <article class="plan-item">
                <h3 class="plan-item__title"><a th:href="@{/plans/{id}(id=${p.id})}" href="#" th:text="${p.title}">title</a></h3>
                <p class="plan-item__meta">
                    <span th:text="#{common.period(${p.startDate}, ${p.endDate})}">period</span>
                    <span><th:block th:replace="~{fragments/layout :: enumLabelIn('plans.item.priority', 'Priority', ${p.priority})}">priority</th:block></span>
                    <span th:text="#{plans.item.estimated(${p.estimatedMinutes})}">estimated</span>
                    <span class="badge badge--carried" th:if="${p.carriedImprovement != null and !#strings.isEmpty(p.carriedImprovement)}"
                          th:text="#{badge.carried}">carried</span>
                </p>
                <p class="plan-item__actions">
                    <a class="btn btn--secondary" th:href="@{/plans/{id}/todos(id=${p.id})}" href="#"><th:block th:text="#{plans.item.todos}">todos</th:block><span
                            class="visually-hidden" th:text="#{common.srContext(${p.title})}"></span></a>
                    <a class="btn btn--secondary" th:href="@{/plans/{id}(id=${p.id})} + '#reviews'" href="#"><th:block th:text="#{plans.item.reviews}">reviews</th:block><span
                            class="visually-hidden" th:text="#{common.srContext(${p.title})}"></span></a>
                </p>
            </article>
        </li>
    </ul>
</th:block>

<!--/* PlanForm fields. Must be included inside a form with th:object="${planForm}". priorities: enum values.
       Error state is carried by aria-invalid (styled in CSS) and the field error text (D11). */-->
<th:block th:fragment="planFields(priorities)">
    <div class="field">
        <label for="title" th:text="#{form.plan.title.label}">title</label>
        <p class="field-help" id="title-help" th:text="#{form.title.help}">help</p>
        <p th:replace="~{fragments/layout :: fieldError('title')}"></p>
        <input type="text" th:field="*{title}" maxlength="200" required
               th:attr="aria-describedby=${#fields.hasErrors('title')} ? 'title-help title-error' : 'title-help',aria-invalid=${#fields.hasErrors('title')} ? 'true' : null">
    </div>

    <fieldset class="field-group field-group--pair">
        <legend th:text="#{form.plan.period.legend}">period</legend>
        <div class="field">
            <label for="startDate" th:text="#{form.plan.startDate.label}">start</label>
            <p th:replace="~{fragments/layout :: fieldError('startDate')}"></p>
            <input type="date" th:field="*{startDate}" required
                   th:attr="aria-describedby=${#fields.hasErrors('startDate')} ? 'startDate-error' : null,aria-invalid=${#fields.hasErrors('startDate')} ? 'true' : null">
        </div>
        <div class="field">
            <label for="endDate" th:text="#{form.plan.endDate.label}">end</label>
            <p class="field-help" id="endDate-help" th:text="#{form.plan.endDate.help}">help</p>
            <p th:replace="~{fragments/layout :: fieldError('endDate')}"></p>
            <input type="date" th:field="*{endDate}" required
                   th:attr="aria-describedby=${#fields.hasErrors('endDate')} ? 'endDate-help endDate-error' : 'endDate-help',aria-invalid=${#fields.hasErrors('endDate')} ? 'true' : null">
        </div>
    </fieldset>

    <div class="field">
        <label for="priority" th:text="#{form.priority.label}">priority</label>
        <p th:replace="~{fragments/layout :: fieldError('priority')}"></p>
        <select th:field="*{priority}" required
                th:attr="aria-describedby=${#fields.hasErrors('priority')} ? 'priority-error' : null,aria-invalid=${#fields.hasErrors('priority')} ? 'true' : null">
            <option value="" th:text="#{common.select.placeholder}">select</option>
            <option th:each="pr : ${priorities}" th:value="${pr}"><th:block
                    th:replace="~{fragments/layout :: enumLabel('Priority', ${pr})}">priority</th:block></option>
        </select>
    </div>

    <div class="field">
        <label for="successCriteria" th:text="#{form.plan.successCriteria.label}">criteria</label>
        <p class="field-help" id="successCriteria-help" th:text="#{form.plan.successCriteria.help}">help</p>
        <p th:replace="~{fragments/layout :: fieldError('successCriteria')}"></p>
        <textarea th:field="*{successCriteria}" rows="4" maxlength="1000" required
                  th:attr="aria-describedby=${#fields.hasErrors('successCriteria')} ? 'successCriteria-help successCriteria-error' : 'successCriteria-help',aria-invalid=${#fields.hasErrors('successCriteria')} ? 'true' : null"></textarea>
    </div>

    <div class="field">
        <label for="estimatedMinutes" th:text="#{form.estimatedMinutes.label}">minutes</label>
        <p class="field-help" id="estimatedMinutes-help" th:text="#{form.plan.estimatedMinutes.help}">help</p>
        <p th:replace="~{fragments/layout :: fieldError('estimatedMinutes')}"></p>
        <span class="input-unit">
            <input type="number" th:field="*{estimatedMinutes}" min="0" max="525600" step="1" inputmode="numeric" required
                   th:attr="aria-describedby=${#fields.hasErrors('estimatedMinutes')} ? 'estimatedMinutes-help estimatedMinutes-error' : 'estimatedMinutes-help',aria-invalid=${#fields.hasErrors('estimatedMinutes')} ? 'true' : null">
            <span aria-hidden="true" th:text="#{form.unit.minutes}">min</span>
        </span>
    </div>
</th:block>

</body>
</html>
