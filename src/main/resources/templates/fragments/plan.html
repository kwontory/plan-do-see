<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* Plan list with its sort note above the rows (home). plans: List<PlanRow> */-->
<th:block th:fragment="planList(plans)">
    <p class="sort-note" th:text="#{plans.list.sortNote}">sort</p>
    <th:block th:replace="~{fragments/plan :: planRows(${plans})}"></th:block>
</th:block>

<!--/* Plan rows without the sort note (the plans page shows it under its h1). plans: List<PlanRow>.
       Row: title link, then period, priority, estimate (and "carried" when the plan came from a review) as chips;
       the todo and review links sit on the right (below on narrow screens). */-->
<th:block th:fragment="planRows(plans)">
    <!--/* Empty state: secondary button, the page head already has the primary "new plan" button. */-->
    <div class="empty-state" th:if="${plans == null or plans.isEmpty()}">
        <p th:text="#{plans.list.empty}">empty</p>
        <a class="btn btn--line" th:href="@{/plans/new}" href="/plans/new" th:text="#{plans.new}">new</a>
    </div>
    <ul class="plan-rows" th:unless="${plans == null or plans.isEmpty()}">
        <li th:each="p : ${plans}" class="plan-row">
            <div class="plan-row__main">
                <h3 class="plan-row__title"><a th:href="@{/plans/{id}(id=${p.id})}" href="#" th:text="${p.title}">title</a></h3>
                <p class="chips">
                    <span class="chip"><svg th:replace="~{fragments/layout :: icon('calendar')}"></svg><span class="num"
                            th:text="#{common.period(${p.startDate}, ${p.endDate})}">period</span></span>
                    <span class="pri" th:classappend="${'pri--' + #strings.toLowerCase(p.priority)}"><th:block
                            th:replace="~{fragments/layout :: enumLabelIn('plans.item.priority', 'Priority', ${p.priority})}">priority</th:block></span>
                    <span class="chip"><svg th:replace="~{fragments/layout :: icon('clock')}"></svg><span class="num"><th:block
                            th:text="#{plans.item.estimatedLabel}">estimated</th:block> <th:block
                            th:replace="~{fragments/layout :: duration(${p.estimatedDuration})}">0</th:block></span></span>
                    <span class="chip status-carried" th:if="${p.carriedImprovement != null and !#strings.isEmpty(p.carriedImprovement)}"><span
                            aria-hidden="true">↳ </span><th:block th:text="#{badge.carried}">carried</th:block></span>
                </p>
            </div>
            <p class="plan-row__acts">
                <a class="btn btn--line btn--sm" th:href="@{/plans/{id}/todos(id=${p.id})}" href="#"><th:block th:text="#{plans.item.todos}">todos</th:block><span
                        class="visually-hidden" th:text="#{common.srContext(${p.title})}"></span></a>
                <a class="btn btn--line btn--sm" th:href="@{/plans/{id}(id=${p.id})} + '#reviews'" href="#"><th:block th:text="#{plans.item.reviews}">reviews</th:block><span
                        class="visually-hidden" th:text="#{common.srContext(${p.title})}"></span></a>
            </p>
        </li>
    </ul>
</th:block>

<!--/* PlanForm fields. Must be included inside a form with th:object="${planForm}". priorities: enum values.
       v2 field order (canvas note dev-error-focus): label -> input -> field error (red text only; the form carries
       form--v2 so the input keeps its border) -> help. The input has aria-invalid="true" on error and its
       aria-describedby lists the error id first, then the help, then the ADR-18 "differs from the latest" note
       (changedNote, beside the label on a conflict page). Two-column grid: period dates side by side, priority in the
       first column, the rest full width. */-->
<th:block th:fragment="planFields(priorities)">
    <div class="form-grid form-grid--2">
    <div class="field field--span2" th:with="err=${#fields.hasErrors('title')}, chg=${changedFields != null and changedFields.contains('title')}">
        <label for="title"><th:block th:text="#{form.plan.title.label}">title</th:block><span
                th:replace="~{fragments/layout :: changedMark('title')}"></span></label>
        <span th:replace="~{fragments/layout :: changedNote('title')}"></span>
        <input type="text" th:field="*{title}" maxlength="200" required
               th:attr="aria-describedby=${(err ? 'title-error ' : '') + 'title-help' + (chg ? ' title-changed' : '')},aria-invalid=${err} ? 'true' : null">
        <p th:replace="~{fragments/layout :: fieldMessage('title')}"></p>
        <p class="field-help" id="title-help" th:text="#{form.title.help}">help</p>
    </div>

    <fieldset class="field-group field-group--pair field--span2">
        <legend th:text="#{form.plan.period.legend}">period</legend>
        <div class="field" th:with="err=${#fields.hasErrors('startDate')}, chg=${changedFields != null and changedFields.contains('startDate')},
                                    desc=${#strings.trim((err ? 'startDate-error ' : '') + (chg ? 'startDate-changed' : ''))}">
            <label for="startDate"><th:block th:text="#{form.plan.startDate.label}">start</th:block><span
                    th:replace="~{fragments/layout :: changedMark('startDate')}"></span></label>
            <span th:replace="~{fragments/layout :: changedNote('startDate')}"></span>
            <input th:replace="~{fragments/layout :: dateInput('date', 'startDate', true, ${desc})}">
            <p th:replace="~{fragments/layout :: fieldMessage('startDate')}"></p>
        </div>
        <div class="field" th:with="err=${#fields.hasErrors('endDate')}, chg=${changedFields != null and changedFields.contains('endDate')}">
            <label for="endDate"><th:block th:text="#{form.plan.endDate.label}">end</th:block><span
                    th:replace="~{fragments/layout :: changedMark('endDate')}"></span></label>
            <span th:replace="~{fragments/layout :: changedNote('endDate')}"></span>
            <input th:replace="~{fragments/layout :: dateInput('date', 'endDate', true, ${(err ? 'endDate-error ' : '') + 'endDate-help' + (chg ? ' endDate-changed' : '')})}">
            <p th:replace="~{fragments/layout :: fieldMessage('endDate')}"></p>
            <p class="field-help" id="endDate-help" th:text="#{form.plan.endDate.help}">help</p>
        </div>
    </fieldset>

    <div class="field field--row" th:with="err=${#fields.hasErrors('priority')}, chg=${changedFields != null and changedFields.contains('priority')},
                                desc=${#strings.trim((err ? 'priority-error ' : '') + (chg ? 'priority-changed' : ''))}">
        <label for="priority"><th:block th:text="#{form.priority.label}">priority</th:block><span
                th:replace="~{fragments/layout :: changedMark('priority')}"></span></label>
        <span th:replace="~{fragments/layout :: changedNote('priority')}"></span>
        <select th:field="*{priority}" required
                th:attr="aria-describedby=${#strings.isEmpty(desc)} ? null : ${desc},aria-invalid=${err} ? 'true' : null">
            <option value="" th:text="#{common.select.placeholder}">select</option>
            <option th:each="pr : ${priorities}" th:value="${pr}"><th:block
                    th:replace="~{fragments/layout :: enumLabel('Priority', ${pr})}">priority</th:block></option>
        </select>
        <p th:replace="~{fragments/layout :: fieldMessage('priority')}"></p>
    </div>

    <div class="field field--span2" th:with="err=${#fields.hasErrors('successCriteria')}, chg=${changedFields != null and changedFields.contains('successCriteria')}">
        <label for="successCriteria"><th:block th:text="#{form.plan.successCriteria.label}">criteria</th:block><span
                th:replace="~{fragments/layout :: changedMark('successCriteria')}"></span></label>
        <span th:replace="~{fragments/layout :: changedNote('successCriteria')}"></span>
        <textarea th:field="*{successCriteria}" rows="4" maxlength="1000" required
                  th:attr="aria-describedby=${(err ? 'successCriteria-error ' : '') + 'successCriteria-help' + (chg ? ' successCriteria-changed' : '')},aria-invalid=${err} ? 'true' : null"></textarea>
        <p th:replace="~{fragments/layout :: fieldMessage('successCriteria')}"></p>
        <p class="field-help" id="successCriteria-help" th:text="#{form.plan.successCriteria.help}">help</p>
    </div>

    <fieldset th:replace="~{fragments/layout :: durationInput('form.plan.estimatedMinutes.help', 'field--span2')}"></fieldset>
    </div>
</th:block>

<!--/* ADR-18 latest panel values of a plan (model latest: PlanRow). "period" is one line for both dates. */-->
<dl th:fragment="planLatestFields" class="dl-grid">
    <dt><th:block th:text="#{plans.field.title}">title</th:block> <span th:replace="~{fragments/layout :: changedBadge('title')}"></span></dt>
    <dd th:replace="~{fragments/layout :: latestValue('title', ${latest.title}, null)}"></dd>
    <dt><th:block th:text="#{plans.field.period}">period</th:block> <span th:replace="~{fragments/layout :: changedBadge('period')}"></span></dt>
    <dd th:replace="~{fragments/layout :: latestValue('period', #{common.period(${latest.startDate}, ${latest.endDate})}, 'num')}"></dd>
    <dt><th:block th:text="#{plans.field.priority}">priority</th:block> <span th:replace="~{fragments/layout :: changedBadge('priority')}"></span></dt>
    <dd th:replace="~{fragments/layout :: latestContent('priority', ~{fragments/layout :: enumLabel('Priority', ${latest.priority})}, null)}"></dd>
    <dt><th:block th:text="#{plans.field.successCriteria}">criteria</th:block> <span th:replace="~{fragments/layout :: changedBadge('successCriteria')}"></span></dt>
    <dd th:replace="~{fragments/layout :: latestValue('successCriteria', ${latest.successCriteria}, 'pre-wrap')}"></dd>
    <dt><th:block th:text="#{plans.field.estimatedMinutes}">estimated</th:block> <span th:replace="~{fragments/layout :: changedBadge('estimatedMinutes')}"></span></dt>
    <dd th:replace="~{fragments/layout :: latestContent('estimatedMinutes', ~{fragments/layout :: duration(${latest.estimatedDuration})}, 'num')}"></dd>
</dl>

<!--/* Submitted PlanForm shown read-only for copying (no inputs, no save). form: PlanForm; any value may be empty. */-->
<dl th:fragment="planInputReadonly(form)" class="dl-grid">
    <dt th:text="#{plans.field.title}">title</dt>
    <dd th:text="${#strings.isEmpty(form.title)} ? #{common.none} : ${form.title}">title</dd>
    <dt th:text="#{plans.field.period}">period</dt>
    <dd th:text="#{common.period(${form.startDate != null ? form.startDate : #messages.msg('common.none')}, ${form.endDate != null ? form.endDate : #messages.msg('common.none')})}">period</dd>
    <dt th:text="#{plans.field.priority}">priority</dt>
    <dd><th:block th:if="${form.priority != null}"><th:block th:replace="~{fragments/layout :: enumLabel('Priority', ${form.priority})}">priority</th:block></th:block><th:block
            th:if="${form.priority == null}" th:text="#{common.none}">none</th:block></dd>
    <dt th:text="#{plans.field.successCriteria}">criteria</dt>
    <dd class="pre-wrap" th:text="${#strings.isEmpty(form.successCriteria)} ? #{common.none} : ${form.successCriteria}">criteria</dd>
    <dt th:text="#{plans.field.estimatedMinutes}">estimated</dt>
    <dd class="num"><th:block th:replace="~{fragments/layout :: durationOrInput(${form})}">0</th:block></dd>
</dl>

</body>
</html>
