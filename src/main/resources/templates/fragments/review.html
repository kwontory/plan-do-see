<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* Latest panel values of a review's improvement (reviews/detail improvement conflict and the next-plan
       form sent after the improvement was already carried). review: ReviewRow as stored now,
       nextPlan: PlanRow or null. The "changed" badge only appears when the model changedFields lists improvement. */-->
<dl th:fragment="improvementLatest(review, nextPlan)" class="dl-grid">
    <dt><th:block th:text="#{reviews.detail.improvement.heading}">improvement</th:block> <span
            th:replace="~{fragments/layout :: changedBadge('improvement')}"></span></dt>
    <dd th:replace="~{fragments/layout :: latestValue('improvement', ${#strings.isEmpty(review.improvement)} ? #{common.none} : ${review.improvement}, 'pre-wrap')}"></dd>
    <th:block th:if="${review.transferred}">
        <th:block th:if="${review.transferredAt != null}">
            <dt th:text="#{reviews.detail.improvement.transferredAt}">transferred at</dt>
            <dd><time th:replace="~{fragments/layout :: datetime(${review.transferredAt})}"></time></dd>
        </th:block>
        <dt th:text="#{reviews.detail.next.heading}">next plan</dt>
        <dd><p th:if="${nextPlan != null}" th:text="#{reviews.detail.next.title(${nextPlan.title})}">next</p>
            <p><a th:href="@{/plans/{id}(id=${review.nextPlanId})}" href="#" th:text="#{reviews.detail.next.view}">view</a></p></dd>
    </th:block>
</dl>

<!--/* One metric card of the review screen (counts, estimated, actual; the variance has its own card below).
       key: metric key, v: server value, reviewId: review id. Labels and units are chosen here; the card links to the
       evidence. Time metrics (model metricDurations: estimated, actual) print as days, hours and minutes with each number
       large and each unit small (layout :: durationStat); counts print the number and metric.<key>.unit. */-->
<a th:fragment="metricCard(key, v, reviewId)" class="stat"
   th:href="@{/reviews/{id}/evidence(id=${reviewId},metric=${key})}" href="#"
   th:attr="aria-describedby=|metric-desc-${key}|">
    <span class="stat__label" th:text="${#messages.msg('metric.' + key + '.label')}">label</span>
    <span class="visually-hidden"> </span>
    <span class="stat__value num" th:attr="data-test=|metric-value-${key}|" th:data-value="${v}"
          th:with="d=${metricDurations != null ? metricDurations.get(key) : null}"><th:block th:if="${d != null}"><th:block
            th:replace="~{fragments/layout :: durationStat(${d})}">0</th:block></th:block><th:block
            th:if="${d == null}"><th:block th:text="${v}">0</th:block><small
            th:text="${#messages.msg('metric.' + key + '.unit')}">unit</small></th:block></span>
    <span class="stat__desc" aria-hidden="true" th:id="|metric-desc-${key}|"
          th:text="${#messages.msg('metric.' + key + '.description')}">description</span>
    <span class="stat__cta"><span class="visually-hidden">, </span><th:block
            th:text="#{reviews.detail.metrics.cta}">evidence</th:block><span aria-hidden="true"> →</span></span>
</a>

<!--/* Difference between actual and estimated as one sentence (ADR-42). parts: DurationParts of "actual - estimated"
       from the server (metricDurations.variance, summary.varianceDuration, evidenceVarianceDuration): negative = took
       less than the estimate, positive = took more, neither = the same. The template only picks the sentence; the
       duration prints without a sign (layout :: duration, "1일 2시간 30분") inside one unbreakable chunk. Fixed word
       order: review.variance.lead + duration + review.variance.faster | review.variance.slower. */-->
<th:block th:fragment="varianceSentence(parts)"><th:block th:if="${parts.negative or parts.positive}"><th:block
        th:text="#{review.variance.lead}">than estimated</th:block> <strong class="duration-chunk"><th:block
        th:replace="~{fragments/layout :: duration(${parts})}">41분</th:block></strong> <th:block
        th:text="${parts.negative} ? #{review.variance.faster} : #{review.variance.slower}">faster</th:block></th:block><th:block
        th:unless="${parts.negative or parts.positive}" th:text="#{review.variance.same}">same</th:block></th:block>

<!--/* Variance card: no heading, one sentence, then the evidence link (T06-C83). v: the signed minutes (metricValues,
       kept in data-value for tests). Without metricDurations (stand-in page) the minutes and unit are printed. */-->
<a th:fragment="varianceCard(v, reviewId)" class="stat stat--variance"
   th:href="@{/reviews/{id}/evidence(id=${reviewId},metric='variance')}" href="#">
    <span class="stat__sentence" data-test="metric-value-variance" th:data-value="${v}"
          th:with="d=${metricDurations != null ? metricDurations.get('variance') : null}"><th:block th:if="${d != null}"><th:block
            th:replace="~{fragments/review :: varianceSentence(${d})}">sentence</th:block></th:block><th:block
            th:if="${d == null}"><th:block th:text="${v}">0</th:block><small th:text="#{metric.variance.unit}">unit</small></th:block></span>
    <span class="stat__cta"><span class="visually-hidden">, </span><th:block
            th:text="#{reviews.detail.metrics.cta}">evidence</th:block><span aria-hidden="true"> →</span></span>
</a>

<!--/* Estimated vs actual bars. summary: ReviewSummary or null (nothing is drawn without it). The widths
       come from the server (summary.bars.estimatedPercent / actualPercent, 0-100, the larger sum is 100); the template
       only prints them as SVG width percentages (no inline style: CSP). Decorative: aria-hidden, because the
       estimated / actual cards beside the bars carry the same numbers. */-->
<div th:fragment="timeBars(summary)" th:if="${summary != null and summary.bars != null}" class="bars" aria-hidden="true">
    <div class="bar">
        <span class="bar__label" th:text="#{reviews.detail.bars.estimated}">estimated</span>
        <svg class="bar__track" focusable="false"><rect class="bar__fill bar__fill--estimated" x="0" y="0" height="100%" rx="7"
                th:attr="width=|${summary.bars.estimatedPercent}%|" width="0%"/></svg>
        <span class="bar__value num"><th:block th:replace="~{fragments/layout :: duration(${summary.estimatedDuration})}">0</th:block></span>
    </div>
    <div class="bar">
        <span class="bar__label" th:text="#{reviews.detail.bars.actual}">actual</span>
        <svg class="bar__track" focusable="false"><rect class="bar__fill" x="0" y="0" height="100%" rx="7"
                th:attr="width=|${summary.bars.actualPercent}%|" width="0%"/></svg>
        <span class="bar__value num"><th:block th:replace="~{fragments/layout :: duration(${summary.actualDuration})}">0</th:block></span>
    </div>
</div>

</body>
</html>
