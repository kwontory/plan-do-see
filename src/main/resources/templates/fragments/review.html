<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* ADR-18 latest panel values of a review's improvement (reviews/detail improvement conflict and the next-plan
       form sent after the improvement was already carried, 11.5.5). review: ReviewRow as stored now,
       nextPlan: PlanRow or null. The "changed" badge only appears when the model changedFields lists improvement. */-->
<dl th:fragment="improvementLatest(review, nextPlan)" class="dl-grid">
    <dt><th:block th:text="#{reviews.detail.improvement.heading}">improvement</th:block> <span
            th:replace="~{fragments/layout :: changedBadge('improvement')}"></span></dt>
    <dd class="pre-wrap" th:text="${#strings.isEmpty(review.improvement)} ? #{common.none} : ${review.improvement}">improvement</dd>
    <th:block th:if="${review.transferred}">
        <th:block th:if="${review.transferredAt != null}">
            <dt th:text="#{reviews.detail.improvement.transferredAt}">transferred at</dt>
            <dd><time th:replace="~{fragments/layout :: datetime(${review.transferredAt})}"></time></dd>
        </th:block>
        <dt th:text="#{reviews.detail.next.heading}">next plan</dt>
        <dd><p th:if="${nextPlan != null}" th:text="#{reviews.detail.next.title(${nextPlan.title})}">next</p>
            <p><a th:href="@{/plans/{id}(id=${review.nextPlanId})}" href="#" th:text="#{reviews.detail.next.view}">view</a></p></dd>
    </th:block>
</dl>

<!--/* One metric card of the review screen (S04). key: metric key, v: server value, reviewId: review id.
       Labels, units and the sign of the variance are chosen here (ADR-13); the card links to the evidence (T06-C83). */-->
<a th:fragment="metricCard(key, v, reviewId)" class="link-card"
   th:href="@{/reviews/{id}/evidence(id=${reviewId},metric=${key})}" href="#"
   th:attr="aria-describedby=|metric-desc-${key}|">
    <span class="link-card__label" th:text="${#messages.msg('metric.' + key + '.label')}">label</span>
    <span class="visually-hidden"> </span>
    <span class="link-card__value num" th:attr="data-test=|metric-value-${key}|" th:data-value="${v}"><th:block
            th:if="${key == 'variance'}"><th:block th:replace="~{fragments/layout :: signedMinutes(${v})}"></th:block></th:block><th:block
            th:unless="${key == 'variance'}" th:text="#{reviews.detail.metrics.value(${v}, ${#messages.msg('metric.' + key + '.unit')})}">0</th:block></span>
    <span class="link-card__desc" aria-hidden="true" th:id="|metric-desc-${key}|"
          th:text="${#messages.msg('metric.' + key + '.description')}">description</span>
    <span class="link-card__cta"><span class="visually-hidden">, </span><th:block
            th:text="#{reviews.detail.metrics.cta}">evidence</th:block><span aria-hidden="true"> →</span></span>
</a>

</body>
</html>
