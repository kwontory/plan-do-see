<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('PlanDoSee Diary', false)}">
    <meta charset="UTF-8">
    <title>PlanDoSee Diary</title>
</head>
<body>
<header th:replace="~{fragments/layout :: header('home')}"></header>

<main id="main" tabindex="-1">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1>PlanDoSee Diary</h1>

    <section aria-labelledby="notice-heading" class="section">
        <h2 id="notice-heading">공개 안내</h2>
        <div class="notice-box">
            <p id="public-notice" class="notice-box__text" th:text="${publicNotice}">지금은 로그인이 없어 링크를 아는 사람은 누구나 볼 수 있습니다. 남이 봐도 괜찮은 내용만 넣으세요</p>
        </div>
        <p class="muted">이름, 연락처, 건강·금융 정보처럼 남에게 보이면 곤란한 내용은 적지 마세요.</p>
    </section>

    <section aria-labelledby="steps-heading" class="section">
        <h2 id="steps-heading">사용 순서</h2>
        <ol class="steps">
            <li>계획(Plan): 기간, 우선순위, 성공 기준, 예상 시간을 적습니다.</li>
            <li>실행(Do): 할 일을 완료하고 실제로 한 시간을 실행 기록으로 남깁니다.</li>
            <li>회고(See): 예상과 실제의 차이를 근거 기록까지 확인하고 개선점을 다음 계획으로 넘깁니다.</li>
        </ol>
    </section>

    <section aria-labelledby="plans-heading" class="section">
        <h2 id="plans-heading">계획</h2>
        <p><a class="btn" th:href="@{/plans/new}" href="/plans/new">새 계획 만들기</a></p>
        <th:block th:replace="~{fragments/plan :: planList(${plans})}"></th:block>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
