<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:with="formError=${#fields.hasErrors('${todoForm.*}')},
               conflict=${latest != null or snapshotUnavailable == true}">
<head th:replace="~{fragments/layout :: head(#{todos.form.pageTitle(${todo.title})}, ${formError})}">
    <meta charset="UTF-8">
    <title>todo edit</title>
</head>
<body>
<header th:replace="~{fragments/shell :: shell('plans', ${plan}, 'do')}"></header>

<main id="main" tabindex="-1" class="wrap">
    <div class="page-head">
        <nav class="breadcrumb" th:attr="aria-label=#{layout.breadcrumb.label}">
            <ol>
                <li><a th:href="@{/plans}" href="/plans" th:text="#{breadcrumb.plans}">plans</a></li>
                <!--/* planId is unknown on the stand-in page (snapshotUnavailable): those two steps are left out. */-->
                <th:block th:if="${todo.planId != null}">
                    <li><a th:href="@{/plans/{id}(id=${todo.planId})}" href="#"
                           th:text="${plan != null} ? ${plan.title} : #{breadcrumb.thisPlan}">plan</a></li>
                    <li><a th:href="@{/plans/{id}/todos(id=${todo.planId})}" href="#" th:text="#{breadcrumb.todos}">todos</a></li>
                </th:block>
                <li><a th:href="@{/todos/{id}(id=${todo.id})}" href="#" th:text="${todo.title}">todo</a></li>
                <li aria-current="page" th:text="#{breadcrumb.edit}">edit</li>
            </ol>
        </nav>
        <div th:replace="~{fragments/layout :: flash}"></div>
        <h1 th:text="#{todos.form.heading}">edit</h1>
        <p class="subtitle" th:unless="${conflict}" th:text="${todo.title}">todo</p>
        <nav th:replace="~{fragments/layout :: flowSteps('do', ${todo.planId})}"></nav>
    </div>

    <!--/* Conflict: "not saved" alert -> latest (read-only, left) | my input (kept, right). */-->
    <th:block th:object="${todoForm}" th:with="showJumps=${latest != null}">
        <div th:replace="~{fragments/layout :: errorAlert}"></div>
    </th:block>
    <p class="note" th:if="${snapshotUnavailable == true}" th:text="#{conflict.latest.unavailable}">unavailable</p>

    <div class="section" th:classappend="${latest != null} ? 'conflict-layout' : 'form-page'">
        <th:block th:if="${latest != null}">
            <section th:replace="~{fragments/layout :: conflictLatest(2, ${latest.updatedAt}, @{/todos/{id}/edit(id=${todo.id})}, ~{fragments/todo :: todoLatestFields})}"></section>
        </th:block>

        <!--/* On a conflict this column is head (heading, intro, notes) + form card, sharing the head row and the card
               row with the latest column (.conflict-col, CSS subgrid). Otherwise the head wrapper is left out. */-->
        <section class="form-area" th:classappend="${latest != null} ? 'conflict-col'"
                 th:attr="id=${conflict} ? 'my-input' : null,tabindex=${conflict} ? '-1' : null,data-test=${conflict} ? 'conflict-mine' : null,aria-labelledby=${conflict} ? 'my-input-heading' : null,aria-label=${conflict} ? null : #{todos.form.heading}">
            <div class="conflict-col__head" th:remove="${latest != null} ? 'none' : 'tag'">
                <div class="form-area__head" th:if="${conflict}">
                    <th:block th:replace="~{fragments/layout :: conflictMineHead(2, true)}"></th:block>
                </div>
                <div class="hint" role="note">
                    <p th:text="#{todos.form.note}">note</p>
                    <p th:text="#{todos.form.revisionNote}">revision note</p>
                </div>
            </div>

            <!--/* Field order: label -> input -> field error -> help; aria-describedby lists
                   the error id first, then the help, then the "differs from the latest" note. */-->
            <div th:replace="~{fragments/layout :: draftNote('todo-edit')}"></div>
            <form method="post" novalidate class="form form--v2 form-card" data-js="focus-first-invalid" data-draft-id="todo-edit"
                  th:action="@{/todos/{id}(id=${todo.id})}" th:object="${todoForm}">
                <input type="hidden" name="_method" value="put">
                <input type="hidden" th:field="*{version}">
                <div class="field" th:with="err=${#fields.hasErrors('title')}, chg=${changedFields != null and changedFields.contains('title')}">
                    <label for="title"><th:block th:text="#{form.todo.title.label}">title</th:block><span
                            th:replace="~{fragments/layout :: changedMark('title')}"></span></label>
                    <span th:replace="~{fragments/layout :: changedNote('title')}"></span>
                    <input type="text" th:field="*{title}" maxlength="200" required
                           th:attr="aria-describedby=${(err ? 'title-error ' : '') + 'title-help' + (chg ? ' title-changed' : '')},aria-invalid=${err} ? 'true' : null">
                    <p th:replace="~{fragments/layout :: fieldMessage('title')}"></p>
                    <p class="field-help" id="title-help" th:text="#{form.title.help}">help</p>
                </div>
                <div class="form-grid form-grid--2">
                    <div class="field" th:with="err=${#fields.hasErrors('dueDate')}, chg=${changedFields != null and changedFields.contains('dueDate')}">
                        <label for="dueDate"><th:block th:text="#{form.todo.dueDate.label}">due</th:block><span
                                th:replace="~{fragments/layout :: changedMark('dueDate')}"></span></label>
                        <span th:replace="~{fragments/layout :: changedNote('dueDate')}"></span>
                        <input th:replace="~{fragments/layout :: dateInput('date', 'dueDate', false, ${(err ? 'dueDate-error ' : '') + 'dueDate-help' + (chg ? ' dueDate-changed' : '')})}">
                        <p th:replace="~{fragments/layout :: fieldMessage('dueDate')}"></p>
                        <p class="field-help" id="dueDate-help" th:text="#{form.todo.dueDate.help}">help</p>
                    </div>
                    <div class="field" th:with="err=${#fields.hasErrors('priority')}, chg=${changedFields != null and changedFields.contains('priority')},
                                                desc=${#strings.trim((err ? 'priority-error ' : '') + (chg ? 'priority-changed' : ''))}">
                        <label for="priority"><th:block th:text="#{form.priority.label}">priority</th:block><span
                                th:replace="~{fragments/layout :: changedMark('priority')}"></span></label>
                        <span th:replace="~{fragments/layout :: changedNote('priority')}"></span>
                        <select th:field="*{priority}" required
                                th:attr="aria-describedby=${#strings.isEmpty(desc)} ? null : ${desc},aria-invalid=${err} ? 'true' : null">
                            <option value="" th:text="#{common.select.placeholder}">select</option>
                            <option th:each="pr : ${priorities}" th:value="${pr}"><th:block
                                    th:replace="~{fragments/layout :: enumLabel('Priority', ${pr})}">priority</th:block></option>
                        </select>
                        <p th:replace="~{fragments/layout :: fieldMessage('priority')}"></p>
                    </div>
                </div>
                <fieldset th:replace="~{fragments/layout :: durationInput('form.todo.estimatedMinutes.help', '')}"></fieldset>
                <div class="field" th:with="err=${#fields.hasErrors('tags')}, chg=${changedFields != null and changedFields.contains('tags')}">
                    <label for="tags"><th:block th:text="#{form.todo.tags.label}">tags</th:block><span
                            th:replace="~{fragments/layout :: changedMark('tags')}"></span></label>
                    <span th:replace="~{fragments/layout :: changedNote('tags')}"></span>
                    <input type="text" th:field="*{tags}"
                           th:attr="aria-describedby=${(err ? 'tags-error ' : '') + 'tags-help' + (chg ? ' tags-changed' : '')},aria-invalid=${err} ? 'true' : null">
                    <p th:replace="~{fragments/layout :: fieldMessage('tags')}"></p>
                    <p class="field-help" id="tags-help" th:text="#{form.todo.tags.help}">help</p>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn" th:attr="data-test=${conflict} ? 'conflict-resubmit' : null"
                            th:text="${conflict} ? #{conflict.mine.resubmit} : #{common.saveEdit}">save</button>
                    <a class="btn btn--line" th:href="@{/todos/{id}(id=${todo.id})}" href="#" th:text="#{common.cancel}">cancel</a>
                </div>
            </form>
        </section>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
