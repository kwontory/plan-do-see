<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:with="formError=${#fields.hasErrors('${executionForm.*}')},
               done=${todo.completed},
               unavailable=${snapshotUnavailable == true}">
<head th:replace="~{fragments/layout :: head(${unavailable} ? #{todos.detail.headingUnknown} : ${todo.title}, ${formError})}">
    <meta charset="UTF-8">
    <title>todo</title>
</head>
<body>
<header th:replace="~{fragments/shell :: shell('plans', ${unavailable ? null : plan}, 'do')}"></header>

<main id="main" tabindex="-1" class="wrap">
    <div class="page-head">
        <nav class="breadcrumb" th:attr="aria-label=#{layout.breadcrumb.label}">
            <ol>
                <li><a th:href="@{/plans}" href="/plans" th:text="#{breadcrumb.plans}">plans</a></li>
                <!--/* Stand-in page (snapshotUnavailable): the plan and the todo title are unknown; those steps are left out. */-->
                <th:block th:unless="${unavailable}">
                    <li><a th:href="@{/plans/{id}(id=${plan.id})}" href="#" th:text="${plan.title}">plan</a></li>
                    <li><a th:href="@{/plans/{id}/todos(id=${plan.id})}" href="#" th:text="#{breadcrumb.todos}">todos</a></li>
                </th:block>
                <li aria-current="page" th:text="${unavailable} ? #{todos.detail.headingUnknown} : ${todo.title}">todo</li>
            </ol>
        </nav>
        <div th:replace="~{fragments/layout :: flash}"></div>
        <h1 th:text="${unavailable} ? #{todos.detail.headingUnknown} : ${todo.title}">todo</h1>
        <th:block th:unless="${unavailable}">
            <nav th:replace="~{fragments/layout :: flowSteps('do', ${plan.id})}"></nav>
        </th:block>
    </div>
    <p class="note" th:if="${unavailable}" data-test="snapshot-unavailable" th:text="#{conflict.latest.unavailable}">unavailable</p>

    <!--/* Top: current values with the state (left column), execution form (right). Both columns end on the same line.
           Stand-in page: only the execution form can be drawn; the other sections need the database. */-->
    <div class="section two" th:classappend="${unavailable} ? 'two--single'">
        <div class="card-stack" th:unless="${unavailable}">
            <!--/* 1. Current values: state, plan value (estimate) and Do value (sum of execution records, server value). */-->
            <section class="card" aria-labelledby="info-heading">
                <div class="card__head">
                    <h2 id="info-heading" th:text="#{todos.detail.info.heading}">info</h2>
                    <span class="badge badge--current" th:text="#{badge.current}">current value</span>
                </div>
                <dl class="dl-grid">
                    <dt class="dt--control" th:text="#{todos.field.status}">status</dt>
                    <dd><details th:replace="~{fragments/todo :: stateMenu(${todo}, ${completionKey})}"></details></dd>
                    <dt th:text="#{todos.field.dueDate}">due</dt>
                    <dd><span th:replace="~{fragments/todo :: dueChip(${todo}, false)}"></span></dd>
                    <dt th:text="#{todos.field.priority}">priority</dt>
                    <dd><span class="pri" th:classappend="${'pri--' + #strings.toLowerCase(todo.priority)}"><th:block
                            th:replace="~{fragments/layout :: enumLabel('Priority', ${todo.priority})}">priority</th:block></span></dd>
                    <dt th:text="#{todos.field.estimatedPlanValue}">estimated</dt>
                    <dd><span class="num" data-test="todo-estimated-minutes" th:data-value="${todo.estimatedMinutes}"><th:block th:replace="~{fragments/layout :: duration(${todo.estimatedDuration})}">0</th:block></span>
                        <span class="dd-note" th:text="#{todos.detail.estimatedNote}">note</span></dd>
                    <dt th:text="#{todos.detail.info.actualTotal}">actual</dt>
                    <dd class="num"><th:block th:replace="~{fragments/layout :: duration(${logsActualDuration})}">0</th:block></dd>
                    <dt th:text="#{todos.field.tags}">tags</dt>
                    <dd th:if="${todo.tags == null or todo.tags.isEmpty()}" th:text="#{common.none}">none</dd>
                    <dd th:unless="${todo.tags == null or todo.tags.isEmpty()}"><ul class="chips">
                        <li th:each="tag : ${todo.tags}" class="chip chip--tag" data-test="todo-tag" th:data-value="${tag.name}"><svg
                                th:replace="~{fragments/layout :: icon('tag')}"></svg><span th:text="${tag.name}">tag</span></li>
                    </ul></dd>
                    <th:block th:if="${done and todo.completedAt != null}">
                        <dt th:text="#{todos.field.completedAt}">completed</dt>
                        <dd class="num"><time th:replace="~{fragments/layout :: datetime(${todo.completedAt})}"></time></dd>
                    </th:block>
                </dl>
                <p class="card-actions"><a class="btn btn--line btn--sm" th:href="@{/todos/{id}/edit(id=${todo.id})}" href="#"><svg
                        th:replace="~{fragments/layout :: icon('edit')}"></svg><span th:text="#{common.edit}">edit</span></a></p>
            </section>
        </div>

        <!--/* 2. Execution form */-->
        <section class="card" aria-labelledby="exec-form-heading">
            <h2 id="exec-form-heading" class="card__title" th:text="#{todos.detail.exec.heading}">record</h2>
            <div th:replace="~{fragments/layout :: draftNote('execution-new')}"></div>
            <form method="post" novalidate class="form form--v2 exec-form" aria-describedby="exec-help" data-js="focus-first-invalid"
                  data-draft-id="execution-new"
                  th:action="@{/todos/{id}/executions(id=${todo.id})}" th:object="${executionForm}">
                <div th:replace="~{fragments/layout :: errorAlert}"></div>
                <div id="exec-help" class="hint" role="note">
                    <p th:text="#{todos.detail.exec.overlapHelp}">overlap</p>
                </div>
                <th:block th:replace="~{fragments/execution :: executionFields}"></th:block>
                <div class="form-actions">
                    <button type="submit" class="btn" th:text="#{todos.detail.exec.submit}">save</button>
                    <p class="lock"><svg th:replace="~{fragments/layout :: icon('info')}"></svg><span
                            th:text="#{todos.detail.exec.auditNote}">audit</span></p>
                </div>
            </form>
        </section>
    </div>

    <th:block th:unless="${unavailable}">

    <!--/* 3. Execution logs */-->
    <section class="section" aria-labelledby="logs-heading">
        <h2 id="logs-heading" th:text="#{todos.detail.logs.heading}">logs</h2>
        <!--/* Count and total cover every record of this todo (server values), not only this page. */-->
        <p class="summary-line num"><th:block th:text="#{todos.detail.logs.summaryLead(${logPage.totalCount})}">0</th:block> <th:block th:replace="~{fragments/layout :: duration(${logsActualDuration})}">0</th:block></p>
        <p class="sort-note" th:text="#{todos.detail.logs.sortNote}">sort</p>
        <p class="empty" th:if="${logs.isEmpty()}" th:text="#{todos.detail.logs.empty}">empty</p>
        <th:block th:unless="${logs.isEmpty()}">
        <!--/* This table fits from 360px; below that (or with a very long word) it scrolls inside its area. */-->
        <p class="table-hint table-hint--narrow" th:text="#{common.table.scrollHint}">scroll</p>
        <div class="table-wrap" tabindex="0" role="region" th:attr="aria-label=#{todos.detail.logs.heading}">
            <table class="table--fit">
                <caption class="visually-hidden" th:text="#{todos.detail.logs.heading}">logs</caption>
                <thead>
                <tr>
                    <th scope="col" th:text="#{todos.detail.logs.col.start}">start</th>
                    <th scope="col" th:text="#{todos.detail.logs.col.end}">end</th>
                    <th scope="col" class="num" th:text="#{todos.detail.logs.col.actual}">actual</th>
                    <th scope="col" class="table__wide" th:text="#{todos.detail.logs.col.blocker}">blocker</th>
                    <th scope="col" class="logs-actions"><span class="visually-hidden" th:text="#{todos.detail.logs.col.actions}">actions</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="log : ${logs}">
                    <td><time th:replace="~{fragments/layout :: datetimeOrUnknown(${log.startedAt})}"></time></td>
                    <td><time th:replace="~{fragments/layout :: datetimeOrUnknown(${log.endedAt})}"></time></td>
                    <td class="num" data-test="execution-actual-minutes" th:data-value="${log.actualMinutes}"><th:block th:replace="~{fragments/layout :: duration(${log.actualDuration})}">0</th:block></td>
                    <td class="pre-wrap table__wide" th:text="${log.blockerReason != null} ? ${log.blockerReason} : #{common.none}">none</td>
                    <td class="logs-actions"><a th:replace="~{fragments/execution :: editLink(${log})}"></a></td>
                </tr>
                </tbody>
                <tfoot>
                <tr>
                    <th scope="row" colspan="2" th:text="#{common.total}">total</th>
                    <td class="num"><th:block th:replace="~{fragments/layout :: duration(${logsActualDuration})}">0</th:block></td>
                    <td></td>
                    <td></td>
                </tr>
                </tfoot>
            </table>
        </div>
        </th:block>
        <p th:replace="~{fragments/layout :: allPagesNote(${logPageNav})}"></p>
        <div th:replace="~{fragments/layout :: pager(${logPageNav}, 'logPage', @{/todos/{id}(id=${todo.id})}, '#logs-heading', ${#messages.msg('pager.nav', #messages.msg('todos.detail.logs.heading'))})}"></div>
    </section>
    <!--/* Completion/reopen records and the todo edit history are not shown (ADR-43): stored and exported only. */-->
    </th:block>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
