<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:with="isEdit=${mode == 'edit'},
               formError=${#fields.hasErrors('${planForm.*}')},
               pageHeading=(${mode == 'edit'} ? #{plans.form.editTitle} : #{plans.form.createTitle}),
               conflict=${latest != null or snapshotUnavailable == true}">
<head th:replace="~{fragments/layout :: head(${pageHeading}, ${formError})}">
    <meta charset="UTF-8">
    <title>plan form</title>
</head>
<body>
<header th:replace="~{fragments/layout :: header('plans')}"></header>

<main id="main" tabindex="-1">
    <nav class="breadcrumb" th:attr="aria-label=#{layout.breadcrumb.label}">
        <ol>
            <li><a th:href="@{/plans}" href="/plans" th:text="#{breadcrumb.plans}">plans</a></li>
            <th:block th:if="${isEdit}">
                <li><a th:href="@{/plans/{id}(id=${plan.id})}" href="#" th:text="${plan.title}">plan</a></li>
                <li aria-current="page" th:text="#{breadcrumb.edit}">edit</li>
            </th:block>
            <li th:unless="${isEdit}" aria-current="page" th:text="#{breadcrumb.newPlan}">new</li>
        </ol>
    </nav>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 th:text="${pageHeading}">plan form</h1>

    <!--/* ADR-18 (screens.md 11.5.2): summary -> latest (read-only) -> my input (kept, can be saved again).
           Without a conflict only the summary (when there are errors) and the form are shown. */-->
    <th:block th:object="${planForm}" th:with="showJumps=${latest != null}">
        <div th:replace="~{fragments/layout :: errorSummary}"></div>
    </th:block>
    <p class="note" th:if="${snapshotUnavailable == true}" th:text="#{conflict.latest.unavailable}">unavailable</p>
    <th:block th:if="${latest != null}">
        <section th:replace="~{fragments/layout :: conflictLatest(2, ${latest.updatedAt}, @{/plans/{id}/edit(id=${plan.id})}, ~{fragments/plan :: planLatestFields})}"></section>
    </th:block>

    <div th:attr="id=${conflict} ? 'my-input' : null,tabindex=${conflict} ? '-1' : null,data-test=${conflict} ? 'conflict-mine' : null,aria-labelledby=${conflict} ? 'my-input-heading' : null,role=${conflict} ? 'region' : null">
        <th:block th:if="${conflict}">
            <th:block th:replace="~{fragments/layout :: conflictMineHead(2, true)}"></th:block>
        </th:block>
        <p class="note" th:if="${isEdit}" th:text="#{plans.form.editNote}">note</p>

        <div class="readonly-box"
             th:if="${isEdit and plan.carriedImprovement != null and !#strings.isEmpty(plan.carriedImprovement)}">
            <p class="readonly-box__label"><span class="badge badge--carried" th:text="#{badge.carried}">carried</span>
                <span class="muted" th:text="#{plans.form.carriedReadonly}">read only</span></p>
            <p class="pre-wrap" th:text="${plan.carriedImprovement}">improvement</p>
        </div>

        <form method="post" novalidate class="form"
              th:action="${isEdit} ? @{/plans/{id}(id=${plan.id})} : @{/plans}"
              th:object="${planForm}">
            <input type="hidden" name="_method" value="put" th:if="${isEdit}">
            <input type="hidden" th:if="${isEdit}" th:field="*{version}">
            <th:block th:replace="~{fragments/plan :: planFields(${priorities})}"></th:block>
            <div class="form-actions">
                <button type="submit" class="btn" th:attr="data-test=${conflict} ? 'conflict-resubmit' : null"
                        th:text="${conflict} ? #{conflict.mine.resubmit} : (${isEdit} ? #{common.saveEdit} : #{plans.form.submitCreate})">save</button>
                <a th:href="${isEdit} ? @{/plans/{id}(id=${plan.id})} : @{/plans}" href="/plans" th:text="#{common.cancel}">cancel</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
