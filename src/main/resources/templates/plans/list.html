<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{plans.list.pageTitle}, false)}">
    <meta charset="UTF-8">
    <title>plans</title>
</head>
<body>
<header th:replace="~{fragments/layout :: header('plans')}"></header>

<main id="main" tabindex="-1" class="wrap">
    <div class="page-head">
        <nav class="breadcrumb" th:attr="aria-label=#{layout.breadcrumb.label}">
            <ol>
                <li aria-current="page" th:text="#{breadcrumb.plans}">plans</li>
            </ol>
        </nav>
        <div th:replace="~{fragments/layout :: flash}"></div>
        <div class="section-head">
            <h1 th:text="#{plans.list.heading}">plans</h1>
            <a class="btn" th:href="@{/plans/new}" href="/plans/new" th:text="#{plans.new}">new</a>
        </div>
    </div>

    <section aria-labelledby="plan-list-heading" class="section">
        <h2 id="plan-list-heading" class="visually-hidden" th:text="#{plans.list.srHeading}">list</h2>
        <th:block th:replace="~{fragments/plan :: planList(${plans})}"></th:block>
        <div th:replace="~{fragments/layout :: pager(${pageNav}, 'page', @{/plans}, '#plan-list-heading', #{plans.list.pagerLabel})}"></div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
