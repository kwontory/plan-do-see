<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('계획', false)}">
    <meta charset="UTF-8">
    <title>계획</title>
</head>
<body>
<header th:replace="~{fragments/layout :: header('plans')}"></header>

<main id="main" tabindex="-1">
    <nav class="breadcrumb" aria-label="현재 위치">
        <ol>
            <li aria-current="page">계획</li>
        </ol>
    </nav>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1>계획</h1>

    <p><a class="btn" th:href="@{/plans/new}" href="/plans/new">새 계획 만들기</a></p>
    <section aria-labelledby="plan-list-heading" class="section">
        <h2 id="plan-list-heading" class="visually-hidden">계획 목록</h2>
        <th:block th:replace="~{fragments/plan :: planList(${plans})}"></th:block>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
