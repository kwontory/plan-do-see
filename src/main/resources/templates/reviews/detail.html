<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:with="formError=${improvementForm != null and #fields.hasErrors('${improvementForm.*}')},
               transferred=${review.nextPlanId != null},
               hasImprovement=${review.improvement != null and !#strings.isEmpty(#strings.trim(review.improvement))},
               unavailable=${snapshotUnavailable == true}">
<head th:replace="~{fragments/layout :: head(${unavailable} ? #{reviews.detail.headingUnknown} : #{reviews.detail.pageTitle(${plan.title})}, ${formError})}">
    <meta charset="UTF-8">
    <title>review</title>
</head>
<body>
<header th:replace="~{fragments/layout :: header('plans')}"></header>

<main id="main" tabindex="-1">
    <nav class="breadcrumb" th:attr="aria-label=#{layout.breadcrumb.label}">
        <ol>
            <li><a th:href="@{/plans}" href="/plans" th:text="#{breadcrumb.plans}">plans</a></li>
            <!--/* ADR-19 stand-in (snapshotUnavailable): the plan is unknown; its step is left out. */-->
            <li th:unless="${unavailable}"><a th:href="@{/plans/{id}(id=${plan.id})}" href="#" th:text="${plan.title}">plan</a></li>
            <li aria-current="page" th:text="#{breadcrumb.review}">review</li>
        </ol>
    </nav>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 th:text="${unavailable} ? #{reviews.detail.headingUnknown} : #{reviews.detail.pageTitle(${plan.title})}">review</h1>
    <p class="note" th:if="${unavailable}" data-test="snapshot-unavailable" th:text="#{conflict.latest.unavailable}">unavailable</p>

    <!--/* ADR-19 stand-in: plan, summary, metricValues and nextPlan are absent, so only the improvement form
           (section 3) is drawn. */-->
    <th:block th:unless="${unavailable}">
    <!--/* 1. Basis */-->
    <section class="section" aria-labelledby="basis-heading">
        <h2 id="basis-heading" th:text="#{reviews.detail.basis.heading}">basis</h2>
        <dl class="dl-grid">
            <dt th:text="#{reviews.detail.basis.period}">period</dt>
            <dd th:text="#{common.period(${review.periodStart}, ${review.periodEnd})}">period</dd>
            <dt th:text="#{reviews.detail.basis.today}">today</dt>
            <dd th:text="#{common.seoulToday(${summary.today})}">today</dd>
            <dt th:text="#{reviews.detail.basis.target}">target</dt>
            <dd th:text="#{reviews.detail.basis.targetValue}">target</dd>
        </dl>
        <p class="muted" th:text="#{reviews.detail.basis.snapshotNote}">snapshot</p>
        <p class="muted" th:text="#{reviews.detail.basis.planEstimateNote(${plan.estimatedMinutes})}">plan estimate</p>
    </section>

    <!--/* 2. Metrics. The server sends metricValues (key -> value); card order, labels, units, sign and links are
           decided here (ADR-13, web-contract revision 3). */-->
    <section class="section" aria-labelledby="metrics-heading"
             th:with="metricOrder=${#strings.arraySplit('planned,completed,overdue,blocked,estimated,actual,variance', ',')}">
        <h2 id="metrics-heading" th:text="#{reviews.detail.metrics.heading}">metrics</h2>
        <p class="note" th:if="${summary.plannedCount == 0}" th:text="#{reviews.detail.metrics.allZero}">all zero</p>
        <p th:text="#{reviews.detail.metrics.intro}">intro</p>
        <ul class="metric-grid">
            <li th:each="key : ${metricOrder}" th:with="v=${metricValues.get(key)}">
                <a class="link-card" th:href="@{/reviews/{id}/evidence(id=${review.id},metric=${key})}" href="#"
                   th:attr="aria-describedby=|metric-desc-${key}|">
                    <span class="link-card__label" th:text="${#messages.msg('metric.' + key + '.label')}">label</span>
                    <span class="visually-hidden"> </span>
                    <span class="link-card__value" th:attr="data-test=|metric-value-${key}|" th:data-value="${v}"><th:block
                            th:if="${key == 'variance'}"><th:block th:replace="~{fragments/layout :: signedMinutes(${v})}"></th:block></th:block><th:block
                            th:unless="${key == 'variance'}" th:text="#{reviews.detail.metrics.value(${v}, ${#messages.msg('metric.' + key + '.unit')})}">0</th:block></span>
                    <span class="link-card__desc" aria-hidden="true" th:id="|metric-desc-${key}|"
                          th:text="${#messages.msg('metric.' + key + '.description')}">description</span>
                    <span class="link-card__cta"><span class="visually-hidden">, </span><th:block
                            th:text="#{reviews.detail.metrics.cta}">evidence</th:block><span aria-hidden="true"> →</span></span>
                </a>
            </li>
        </ul>
    </section>
    </th:block>

    <!--/* 3. Improvement. ADR-18 (screens.md 11.5.2, 11.5.5): on a conflict (model latest) the order is summary ->
           latest (read-only) -> my input. Not yet carried: my input stays in the form and can be saved again.
           Already carried to a next plan: my input is shown read-only for copying, with no form. Headings are h3
           inside this h2 section. */-->
    <section class="section" aria-labelledby="improvement-heading"
             th:with="conflict=${latest != null},
                      loadUrl=${transferred} ? null : @{/reviews/{id}(id=${review.id})} + '#improvement-heading'">
        <h2 id="improvement-heading" th:text="#{reviews.detail.improvement.heading}">improvement</h2>
        <th:block th:if="${improvementForm != null}" th:object="${improvementForm}"
                  th:with="nestedSummary=true, showJumps=${conflict}">
            <div th:replace="~{fragments/layout :: errorSummary}"></div>
        </th:block>
        <th:block th:if="${conflict}">
            <section th:replace="~{fragments/layout :: conflictLatest(3, ${transferred ? null : latest.updatedAt}, ${loadUrl}, ~{fragments/review :: improvementLatest(${latest}, ${nextPlan})})}"></section>
        </th:block>

        <div th:unless="${transferred}"
             th:attr="id=${conflict} ? 'my-input' : null,tabindex=${conflict} ? '-1' : null,data-test=${conflict} ? 'conflict-mine' : null,aria-labelledby=${conflict} ? 'my-input-heading' : null,role=${conflict} ? 'region' : null">
            <th:block th:if="${conflict}">
                <th:block th:replace="~{fragments/layout :: conflictMineHead(3, true)}"></th:block>
            </th:block>
            <form method="post" novalidate class="form"
                  th:action="@{/reviews/{id}/improvement(id=${review.id})}" th:object="${improvementForm}">
                <input type="hidden" name="_method" value="put">
                <input type="hidden" th:field="*{version}">
                <div class="field" th:with="err=${#fields.hasErrors('improvement')}, chg=${changedFields != null and changedFields.contains('improvement')}">
                    <label for="improvement" th:text="#{reviews.detail.improvement.label}">improvement</label>
                    <span th:replace="~{fragments/layout :: changedNote('improvement')}"></span>
                    <p class="field-help" id="improvement-help" th:text="#{reviews.detail.improvement.help}">help</p>
                    <p th:replace="~{fragments/layout :: fieldError('improvement')}"></p>
                    <textarea th:field="*{improvement}" rows="5" maxlength="1000"
                              th:attr="aria-describedby=${'improvement-help' + (err ? ' improvement-error' : '') + (chg ? ' improvement-changed' : '')},aria-invalid=${err} ? 'true' : null"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn" th:attr="data-test=${conflict} ? 'conflict-resubmit' : null"
                            th:text="${conflict} ? #{conflict.mine.resubmit} : #{reviews.detail.improvement.submit}">save</button>
                </div>
            </form>
        </div>

        <div th:if="${transferred and !conflict}" class="readonly-box">
            <p><span class="badge badge--transferred" th:text="#{badge.transferred}">transferred</span></p>
            <p class="pre-wrap" th:text="${review.improvement}">improvement</p>
            <p class="muted" th:if="${review.transferredAt != null}"><th:block th:text="#{reviews.detail.improvement.transferredAt}">at</th:block> <time
                    th:replace="~{fragments/layout :: datetime(${review.transferredAt})}"></time></p>
            <p class="muted" th:text="#{reviews.detail.improvement.locked}">locked</p>
        </div>

        <!--/* Already carried: the input cannot be saved; id="improvement" is the target of the summary's field error link. */-->
        <div th:if="${transferred and conflict}" id="my-input" tabindex="-1" role="region"
             aria-labelledby="my-input-heading" data-test="conflict-mine">
            <th:block th:replace="~{fragments/layout :: conflictMineHead(3, false)}"></th:block>
            <div class="readonly-box" id="improvement" tabindex="-1">
                <p class="pre-wrap" th:text="${improvementForm == null or #strings.isEmpty(improvementForm.improvement)} ? #{common.none} : ${improvementForm.improvement}">input</p>
            </div>
        </div>
    </section>

    <!--/* 4. Next plan (left out on the ADR-19 stand-in: whether the review was carried is unknown) */-->
    <section class="section" aria-labelledby="next-heading" th:unless="${unavailable}">
        <h2 id="next-heading" th:text="#{reviews.detail.next.heading}">next</h2>
        <p th:if="${!transferred and !hasImprovement}" th:text="#{reviews.detail.next.needImprovement}">need</p>
        <th:block th:if="${!transferred and hasImprovement}">
            <p th:text="#{reviews.detail.next.ready}">ready</p>
            <p><a class="btn" th:href="@{/reviews/{id}/next-plan(id=${review.id})}" href="#" th:text="#{reviews.detail.next.create}">create</a></p>
        </th:block>
        <th:block th:if="${transferred}">
            <p th:text="#{reviews.detail.next.done}">done</p>
            <p th:if="${nextPlan != null}" class="muted" th:text="#{reviews.detail.next.title(${nextPlan.title})}">next</p>
            <p><a th:href="@{/plans/{id}(id=${review.nextPlanId})}" href="#" th:text="#{reviews.detail.next.view}">view</a></p>
        </th:block>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
