<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:with="formError=${#fields.hasErrors('${planForm.*}')},
               hasImprovement=${review.improvement != null and !#strings.isEmpty(#strings.trim(review.improvement))},
               conflict=${nextPlan != null},
               unavailable=${snapshotUnavailable == true},
               showForm=${hasImprovement or unavailable}">
<head th:replace="~{fragments/layout :: head(#{reviews.nextPlan.title}, ${formError})}">
    <meta charset="UTF-8">
    <title>next plan</title>
</head>
<body>
<header th:replace="~{fragments/shell :: shell('plans', ${unavailable ? null : plan}, 'see')}"></header>

<main id="main" tabindex="-1" class="wrap">
    <div class="page-head">
        <nav class="breadcrumb" th:attr="aria-label=#{layout.breadcrumb.label}">
            <ol>
                <li><a th:href="@{/plans}" href="/plans" th:text="#{breadcrumb.plans}">plans</a></li>
                <!--/* ADR-19 stand-in (snapshotUnavailable): the plan is unknown; its step is left out. */-->
                <li th:unless="${unavailable}"><a th:href="@{/plans/{id}(id=${plan.id})}" href="#" th:text="${plan.title}">plan</a></li>
                <li><a th:href="@{/reviews/{id}(id=${review.id})}" href="#" th:text="#{breadcrumb.review}">review</a></li>
                <li aria-current="page" th:text="#{reviews.nextPlan.title}">next plan</li>
            </ol>
        </nav>
        <div th:replace="~{fragments/layout :: flash}"></div>
        <h1 th:text="#{reviews.nextPlan.title}">next plan</h1>
        <nav th:replace="~{fragments/layout :: flowSteps('next', ${unavailable ? null : plan.id})}"></nav>
    </div>
    <p class="note" th:if="${unavailable}" data-test="snapshot-unavailable" th:text="#{conflict.latest.unavailable}">unavailable</p>

    <!--/* Same text as the server rule error (D1): review.improvement.missing. On the ADR-19 stand-in the improvement is
           unknown (null), not missing, so the form is still shown. */-->
    <section class="section empty-state" th:unless="${showForm}" th:attr="aria-label=#{reviews.nextPlan.carry.heading}">
        <span class="empty-state__icon" aria-hidden="true"><svg th:replace="~{fragments/layout :: icon('flag')}"></svg></span>
        <p th:text="#{review.improvement.missing}">missing</p>
        <a class="btn btn--line" th:href="@{/reviews/{id}(id=${review.id})}" href="#"><svg
                th:replace="~{fragments/layout :: icon('chevron-left')}"></svg><span th:text="#{common.backToReview}">back</span></a>
    </section>

    <th:block th:if="${showForm}">
        <th:block th:object="${planForm}" th:with="showJumps=${conflict}">
            <div th:replace="~{fragments/layout :: errorAlert}"></div>
        </th:block>

        <!--/* ADR-18 E10 (screens.md 11.5.5): the improvement was already carried (model nextPlan). Nothing was created;
               the carried improvement and the next plan come first, then the input read-only for copying. */-->
        <th:block th:if="${conflict}">
            <div class="section conflict-layout">
                <section th:replace="~{fragments/layout :: conflictLatest(2, null, null, ~{fragments/review :: improvementLatest(${review}, ${nextPlan})})}"></section>
                <section class="conflict-col" id="my-input" tabindex="-1" aria-labelledby="my-input-heading" data-test="conflict-mine">
                    <div class="conflict-col__head">
                        <th:block th:replace="~{fragments/layout :: conflictMineHead(2, false)}"></th:block>
                    </div>
                    <div class="card conflict-panel conflict-panel--mine">
                        <dl th:replace="~{fragments/plan :: planInputReadonly(${planForm})}"></dl>
                    </div>
                </section>
            </div>
            <p class="back-row"><a class="btn btn--line" th:href="@{/reviews/{id}(id=${review.id})}" href="#" th:text="#{common.backToReview}">back</a></p>
        </th:block>

        <th:block th:unless="${conflict}">
            <section class="section" aria-labelledby="carry-heading">
                <h2 id="carry-heading" th:text="#{reviews.nextPlan.carry.heading}">carry</h2>
                <p class="note" th:if="${unavailable}" data-test="section-unavailable" th:text="#{conflict.section.unavailable}">unavailable</p>
                <th:block th:unless="${unavailable}">
                    <div class="card card--handoff">
                        <p class="pre-wrap" th:text="${review.improvement}">improvement</p>
                        <p class="card__foot muted" th:text="#{reviews.nextPlan.carry.source(${plan.title}, ${review.periodStart}, ${review.periodEnd})}">source</p>
                    </div>
                    <p class="small-note" th:text="#{reviews.nextPlan.carry.note}">note</p>
                </th:block>
            </section>

            <section class="section" aria-labelledby="new-plan-heading">
                <h2 id="new-plan-heading" th:text="#{reviews.nextPlan.newPlan.heading}">new plan</h2>
                <form method="post" novalidate class="form form--v2 form-card" data-js="focus-first-invalid"
                      th:action="@{/reviews/{id}/next-plan(id=${review.id})}" th:object="${planForm}">
                    <th:block th:replace="~{fragments/plan :: planFields(${priorities})}"></th:block>
                    <div class="form-actions">
                        <button type="submit" class="btn" th:text="#{reviews.nextPlan.submit}">create</button>
                        <a class="btn btn--line" th:href="@{/reviews/{id}(id=${review.id})}" href="#" th:text="#{common.backToReview}">back</a>
                    </div>
                </form>
            </section>
        </th:block>
    </th:block>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
