server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      # Flash attributes use the HTTP session; never expose its id in URLs (T06-C58).
      tracking-modes: cookie
      cookie:
        http-only: true
        # true on HTTPS deployments (Render sets SESSION_COOKIE_SECURE=true).
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

spring:
  application:
    name: plandosee-diary
  messages:
    # User-facing text lives only here (ADR-13). See docs/architecture/message-keys.md.
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      # ADR-19: wait at most this many milliseconds for a pooled connection (Hikari default is 30 seconds); after
      # that the request gets the "busy" notice instead of hanging.
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:500}
      # ADR-15/ADR-19: time limits set on every pooled session (also in production). Explicit row locks use
      # FOR UPDATE NOWAIT; lock_timeout cuts implicit lock waits (UPDATE, ON CONFLICT) short, before
      # deadlock_timeout (1s), so collisions become an immediate notice. statement_timeout stops slow statements.
      # Values are checked at start-up (DbTimeoutSettings). Needs a session-preserving connection (Direct or
      # Session pooler, see README), not a transaction pooler.
      connection-init-sql: "SELECT set_config('lock_timeout', '${app.db.lock-timeout}', false), set_config('statement_timeout', '${app.db.statement-timeout}', false)"
  transaction:
    # ADR-19: every transaction (reads and writes) ends within the request budget. MyBatis-Spring passes the time
    # left to each statement as its JDBC query timeout. Whole seconds; the budget must be at least 1000 ms.
    default-timeout: ${app.request-budget-ms}ms
  flyway:
    enabled: true
    locations: classpath:db/migration
    # ADR-19: migrations run on their own connection, outside the pool, so the 1s statement_timeout and 100ms
    # lock_timeout of pooled sessions never cut a schema change short. Same URL and credentials as the app.
    user: ${spring.datasource.username}
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  thymeleaf:
    cache: true
  jackson:
    time-zone: UTC

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-handlers-package: com.plandosee.diary.common.mybatis
  configuration:
    map-underscore-to-camel-case: false
    auto-mapping-behavior: NONE
    default-statement-timeout: 30

app:
  demo-user-id: ${APP_DEMO_USER_ID:00000000-0000-4000-8000-000000000001}
  db:
    # PostgreSQL duration: digits with an optional ms, s, or min unit (e.g. 100ms, 1s). 0 disables the limit.
    lock-timeout: ${DB_LOCK_TIMEOUT:100ms}
    statement-timeout: ${DB_STATEMENT_TIMEOUT:1s}
    # ADR-19: SET LOCAL for aggregate and statistics reads only (review summary/detail, evidence, export).
    aggregate-statement-timeout: ${DB_AGGREGATE_STATEMENT_TIMEOUT:2s}
  # ADR-19: page budget in milliseconds. Transaction timeout (spring.transaction.default-timeout) and the
  # slow-request WARN log (RequestBudgetFilter) both use it.
  request-budget-ms: ${APP_REQUEST_BUDGET_MS:3000}
  retry:
    # ADR-15: automatic re-runs of a whole write transaction after a deadlock (40P01), serialization failure
    # (40001), or lock failure (55P03). Delay before retry n = base-delay-ms * n + random(0..jitter-ms).
    # ADR-19: 0 by default, because retrying makes the user wait; the notice asks the user to press again.
    max-retries: ${APP_RETRY_MAX_RETRIES:0}
    base-delay-ms: ${APP_RETRY_BASE_DELAY_MS:50}
    jitter-ms: ${APP_RETRY_JITTER_MS:100}

logging:
  level:
    root: INFO
    # T06-C58 / QA-D4: Flyway logs "Database: <JDBC URL>" at INFO on every start. The DB address must not reach logs.
    org.flywaydb.core.FlywayExecutor: WARN
