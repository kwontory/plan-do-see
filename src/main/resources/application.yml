server:
  port: ${PORT:8080}
  # The request's scheme, host, and port behind a proxy (Render) come from Tomcat's RemoteIpValve.
  # It applies X-Forwarded-Proto/-Host/-Port/-For only when the connection comes from a trusted internal proxy
  # (server.tomcat.remoteip.internal-proxies, env SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES; default private ranges and
  # loopback). SameOriginWriteFilter compares the Origin with that result only and never reads X-Forwarded-* itself.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      # Login sessions live in PostgreSQL (Spring Session JDBC, cookie SESSION). A session ends after this much
      # time without a request; logout and a password change delete it at once.
      timeout: ${SESSION_TIMEOUT:30m}
      # The session id travels only in the cookie, never in URLs.
      tracking-modes: cookie
      cookie:
        http-only: true
        # true on HTTPS deployments (SESSION_COOKIE_SECURE=true).
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

spring:
  application:
    name: plandosee-diary
  messages:
    # User-facing text lives only here.
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      # Wait at most this many milliseconds for a pooled connection (Hikari default is 30 seconds); after
      # that the request gets the "busy" notice instead of hanging.
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:500}
      # Time limits set on every pooled session (also in production). Explicit row locks use
      # FOR UPDATE NOWAIT; lock_timeout cuts implicit lock waits (UPDATE, ON CONFLICT) short, before
      # deadlock_timeout (1s), so collisions become an immediate notice. statement_timeout stops slow statements.
      # Values are checked at start-up (DbTimeoutSettings). Needs a session-preserving connection (Direct or
      # Session pooler, see README), not a transaction pooler.
      connection-init-sql: "SELECT set_config('lock_timeout', '${app.db.lock-timeout}', false), set_config('statement_timeout', '${app.db.statement-timeout}', false)"
  transaction:
    # Every transaction (reads and writes) ends within the request budget. MyBatis-Spring passes the time
    # left to each statement as its JDBC query timeout. Whole seconds; the budget must be at least 1000 ms.
    default-timeout: ${app.request-budget-ms}ms
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrations run on their own connection, outside the pool, so the 1s statement_timeout and 100ms
    # lock_timeout of pooled sessions never cut a schema change short. Same URL and credentials as the app.
    user: ${spring.datasource.username}
  session:
    jdbc:
      # SPRING_SESSION tables come from Flyway (V6), never from Spring Session itself.
      initialize-schema: never
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  web:
    resources:
      # Static files are linked with a content hash in the name (/css/app-<md5>.css; @{...} in templates
      # and url() in CSS are rewritten), so browsers and the CDN can keep them for a year. A changed file
      # gets a new name. Pages stay no-store (SecurityHeadersFilter).
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          max-age: 365d
          s-max-age: 365d
          cache-public: true
  thymeleaf:
    cache: true
  jackson:
    time-zone: UTC

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-handlers-package: com.plandosee.diary.common.mybatis
  configuration:
    map-underscore-to-camel-case: false
    auto-mapping-behavior: NONE
    default-statement-timeout: 30

app:
  # Owner of the data entered before login existed (T06). Used only to move that data to an account; never the
  # owner of a request.
  demo-user-id: ${APP_DEMO_USER_ID:00000000-0000-4000-8000-000000000001}
  session-pool:
    # Connections of the separate Spring Session pool (login sessions), on top of DB_POOL_SIZE.
    size: ${DB_SESSION_POOL_SIZE:2}
  # Rows per page of every paged list (plans, todos, evidence, a todo's records). 1 to 200.
  page-size: ${APP_PAGE_SIZE:50}
  db:
    # PostgreSQL duration: digits with an optional ms, s, or min unit (e.g. 100ms, 1s). 0 disables the limit.
    lock-timeout: ${DB_LOCK_TIMEOUT:100ms}
    statement-timeout: ${DB_STATEMENT_TIMEOUT:1s}
    # SET LOCAL for aggregate and statistics reads only (review summary/detail, evidence, export).
    aggregate-statement-timeout: ${DB_AGGREGATE_STATEMENT_TIMEOUT:2s}
  # Page budget in milliseconds. Transaction timeout (spring.transaction.default-timeout) and the
  # slow-request WARN log (RequestBudgetFilter) both use it.
  request-budget-ms: ${APP_REQUEST_BUDGET_MS:3000}
  retry:
    # Automatic re-runs of a whole write transaction after a deadlock (40P01), serialization failure
    # (40001), or lock failure (55P03). Delay before retry n = base-delay-ms * n + random(0..jitter-ms).
    # 0 by default, because retrying makes the user wait; the notice asks the user to press again.
    max-retries: ${APP_RETRY_MAX_RETRIES:0}
    base-delay-ms: ${APP_RETRY_BASE_DELAY_MS:50}
    jitter-ms: ${APP_RETRY_JITTER_MS:100}

logging:
  level:
    root: INFO
    # Flyway logs "Database: <JDBC URL>" at INFO on every start. The DB address must not reach logs.
    org.flywaydb.core.FlywayExecutor: WARN
