# ----- Review metric descriptions: metric.<key>.description (card) / metric.<key>.condition (evidence page)
metric.planned.description=이 계획에서 삭제하지 않은 할 일 수
metric.completed.description=그중 지금 완료 상태인 할 일 수(완료 버튼을 누른 횟수가 아님)
metric.overdue.description=완료되지 않았고 마감일이 기준일보다 앞선 할 일 수
metric.blocked.description=막힌 이유를 적은 실행 기록이 있는 할 일 수(기록이 여러 건이어도 1건)
metric.estimated.description=대상 할 일의 예상 시간 합계
metric.actual.description=대상 할 일에 남긴 실행 기록의 실제 시간 합계
metric.variance.description=실제 시간 − 예상 시간(+는 더 걸림, -는 덜 걸림)
# {0}: Seoul today (used by overdue only; other keys ignore it)
metric.planned.condition=이 계획에 속한 할 일 중 삭제하지 않은 모든 할 일이에요. 계획의 개수가 아니에요.
metric.completed.condition=대상 할 일 중 지금 상태가 ‘완료’인 할 일이에요. 진행 중으로 되돌린 할 일은 빠져요.
metric.overdue.condition=대상 할 일 중 완료되지 않았고 마감일이 {0}(서울 오늘)보다 앞선 할 일이에요. 오늘 마감, 마감일 없음, 완료된 할 일은 빠져요.
metric.blocked.condition=대상 할 일 중 막힌 이유가 적힌 실행 기록이 하나 이상 있는 할 일이에요. 막힌 이유를 모두 함께 보여 줘요.
metric.estimated.condition=대상 할 일의 예상 시간을 모두 더한 값이에요. 계획에 따로 적은 예상 시간은 더하지 않아요.
metric.actual.condition=대상 할 일에 남긴 모든 실행 기록의 실제 시간을 더한 값이에요. 삭제한 할 일의 기록은 빠져요.
metric.variance.condition=실제 시간 합계에서 예상 시간 합계를 뺀 값이에요. 아래에 두 합계의 근거를 모두 보여 줘요.

