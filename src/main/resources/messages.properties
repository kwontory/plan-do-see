# PlanDoSee Diary user-facing text (ADR-13, web-contract revision 3). UTF-8.
# Key rule: <area>.<target>.<situation>. Catalog: docs/architecture/message-keys.md
# Java code uses only these keys (flash keys, error codes, enum names, metric keys); templates render them with #{...}.
